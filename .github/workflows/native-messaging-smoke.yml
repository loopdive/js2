name: native-messaging smoke (real wasmtime)

# Real-wasmtime round-trip smoke test for the Native Messaging host example.
#
# The JS WASI polyfill zero-inits memory and masked an off-by-one in the
# integer-print helper (#1618) — only real wasmtime, with reused bump memory,
# exposed the stray trailing byte. This job runs the compiled example under an
# actual wasmtime binary and asserts the stdout frame + clean stderr byte-for-
# byte, so a codegen change that breaks the WASI stdout path can't slip through
# the polyfill-based unit tests.
#
# Kept as a separate lightweight job (NOT a required check yet — it can be
# promoted to required later). CI does not otherwise install wasmtime, so this
# job installs a pinned release fresh.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "examples/native-messaging/**"
      - "src/codegen/**"
      - ".github/workflows/native-messaging-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate

      - run: pnpm install --frozen-lockfile

      # v46 is what the example was verified against; it supports the GC /
      # function-references / tail-call / exceptions proposals the module uses
      # via the explicit -W flags the smoke script enables. (Do NOT bump to
      # all-proposals: it turns on stack-switching, which these modules don't use.)
      - name: Install wasmtime (pinned)
        uses: ./.github/actions/setup-wasmtime
        with:
          version: "46.0.1"
          sha256: "9ae0b17ea298bcc52277a8208d6ab7fae8e1a89579672f9d82f9d86c116edb62"

      - name: Verify wasmtime is on PATH
        run: wasmtime --version

      - name: Externref tail-call compatibility regression
        run: >-
          pnpm exec vitest run tests/v8x-js2wasm-spike.test.ts
          -t "executes an externref-returning trampoline in Wasmtime"

      - name: Install bun (the reporter's bundler — loopdive/js2wasm#389)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Native Messaging round-trip smoke test
        run: ./examples/native-messaging/smoke-test.sh

      - name: Native Messaging real-wasmtime SCALE test (all 4 variants, #2807)
        # bun-bundles each variant the reporter's way and round-trips it under
        # real wasmtime at 1/64/128/256 MiB. This catches the #2807 ≥128 MiB
        # silent fd_write failure that the in-process-shim unit tests mask.
        run: node examples/native-messaging/scale-test.mjs
