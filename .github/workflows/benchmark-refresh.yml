name: Refresh Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_performance_regressions:
        description: "Allow performance regressions and continue anyway"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: benchmark-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  refresh-benchmarks:
    if: github.repository == 'loopdive/js2' && (github.event_name != 'push' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Gate MAIN_DEPLOY_KEY (below) behind the same GitHub Environment the
    # test262 baseline promoters use (`baseline-promote`, deployment branches
    # restricted to `main`) — see #1216 follow-up. Push events on main satisfy
    # the branch restriction; pull_request/workflow_dispatch runs never reach
    # the auto-commit step so they never need the secret.
    environment: baseline-promote

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Snapshot current performance baseline
        run: |
          # Canonical committed location is `benchmarks/results/`
          # (see scripts/generate-playground-benchmark-sidebar.mjs RESULTS_PATH).
          # The `public/` and `playground/public/` copies are derived artifacts —
          # they were LFS-tracked until commit 616a7a528 (#1170 LFS migration,
          # 2026-04-25), which untracked all `public/benchmarks/results/*.json`.
          # Prefer the committed location; fall back to derived copies in case
          # someone has them locally (no functional difference — same payload).
          mkdir -p benchmark-baseline
          if [ -f benchmarks/results/playground-benchmark-sidebar.json ]; then
            cp benchmarks/results/playground-benchmark-sidebar.json benchmark-baseline/playground-benchmark-sidebar.json
          elif [ -f website/public/benchmarks/results/playground-benchmark-sidebar.json ]; then
            cp website/public/benchmarks/results/playground-benchmark-sidebar.json benchmark-baseline/playground-benchmark-sidebar.json
          elif [ -f website/playground/public/benchmarks/results/playground-benchmark-sidebar.json ]; then
            cp website/playground/public/benchmarks/results/playground-benchmark-sidebar.json benchmark-baseline/playground-benchmark-sidebar.json
          else
            echo "Missing committed playground benchmark baseline."
            exit 2
          fi

      - name: Refresh benchmark artifacts
        run: pnpm run refresh:benchmarks

      - name: Compare landing-page benchmark performance
        id: benchmark_diff
        run: |
          mkdir -p benchmark-reports
          set +e
          node scripts/diff-playground-benchmarks.mjs \
            --baseline benchmark-baseline/playground-benchmark-sidebar.json \
            --candidate website/public/benchmarks/results/playground-benchmark-sidebar.json \
            --max-relative-regression 0.50 \
            --max-wasm-slowdown 0.40 \
            > benchmark-reports/performance-regressions.txt
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 1 ]; then
            echo "Unexpected benchmark diff exit code $exit_code"
            exit "$exit_code"
          fi
          if [ "$exit_code" -eq 1 ]; then
            echo "regressions=true" >> "$GITHUB_OUTPUT"
          else
            echo "regressions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Print performance regressions (informational on push, gating on PR + workflow_dispatch)
        if: steps.benchmark_diff.outputs.regressions == 'true'
        run: |
          echo "Landing-page benchmark regressions detected relative to benchmarks/results/playground-benchmark-sidebar.json:"
          cat benchmark-reports/performance-regressions.txt
          echo
          echo "Gating policy (#1525, docs/ci-policy.md §6):"
          echo "  - pull_request:     HARD GATE — this workflow fails on regression."
          echo "                      The committed baseline is now CI-runner-derived (#1216),"
          echo "                      so wasm:js-ratio drift is small enough to gate against."
          echo "  - push (main):      informational only — the auto-commit step below skips on"
          echo "                      regression, which is the right outcome (don't promote"
          echo "                      regressed numbers)."
          echo "  - workflow_dispatch: enforced unless allow_performance_regressions=true."
          echo
          echo "Override (PR only): set BENCHMARK_STRICT=0 in the workflow env to demote back to"
          echo "  informational. Only do this with explicit reviewer sign-off."

      - name: Fail on performance regressions (PR + workflow_dispatch)
        # #1525 — PR path is now a hard gate (#1216 made the baseline
        # CI-runner-derived, so wasm:js drift is small enough to enforce).
        # workflow_dispatch: existing behaviour (enforced unless
        # allow_performance_regressions=true).
        # push to main: this step is skipped; the auto-commit step further
        # below already refuses to promote regressed numbers.
        if: |
          steps.benchmark_diff.outputs.regressions == 'true' && (
            (github.event_name == 'pull_request' && env.BENCHMARK_STRICT != '0') ||
            (github.event_name == 'workflow_dispatch' && !inputs.allow_performance_regressions)
          )
        env:
          # Escape hatch: set BENCHMARK_STRICT=0 in workflow env to demote the
          # PR-event gate back to informational. Default (unset) = strict.
          BENCHMARK_STRICT: ${{ env.BENCHMARK_STRICT || '1' }}
        run: |
          echo "Failing workflow due to landing-page benchmark regressions."
          echo "Event: ${{ github.event_name }}; strict=${BENCHMARK_STRICT}"
          exit 1

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          retention-days: 1
          name: benchmark-refresh-report
          path: |
            benchmark-reports/**
            benchmarks/results/latest.json
            benchmarks/results/latest.md
            benchmarks/results/history.json
            benchmarks/results/playground-benchmark-sidebar.json
            benchmarks/results/playground-benchmark-sidebar-no-jit.json
            benchmarks/results/size-benchmarks.json
            website/public/benchmarks/results/latest.json
            website/public/benchmarks/results/history.json
            website/public/benchmarks/results/playground-benchmark-sidebar.json
            website/public/benchmarks/results/playground-benchmark-sidebar-no-jit.json
            website/public/benchmarks/results/size-benchmarks.json
            website/playground/public/benchmarks/results/playground-benchmark-sidebar.json
            website/playground/public/benchmarks/results/playground-benchmark-sidebar-no-jit.json
          if-no-files-found: warn

      # #1216: auto-commit a freshly-generated playground benchmark baseline
      # back to main on push events.
      #
      # RE-ENABLED (post-#491 fix): the #1216 version above pushed straight
      # to `origin` with the default GITHUB_TOKEN, which the main branch
      # ruleset's merge-queue requirement rejects with
      # `GH013: Changes must be made through the merge queue`. That silently
      # froze `benchmarks/results/playground-benchmark-sidebar.json` from
      # 2026-07-24 onward — every later merge left the landing-page perf
      # chart stale even though this job kept running successfully.
      #
      # Fix: push over the same SSH deploy-key bypass the test262 baseline
      # promoters use (`test262-sharded.yml` promote-baseline,
      # `baseline-summary-sync.yml`) — `MAIN_DEPLOY_KEY` is an Actions secret
      # on the `baseline-promote` Environment and is listed in the ruleset's
      # bypass_actors, so a push over that SSH remote is NOT rejected by
      # GH013 the way a GITHUB_TOKEN push is.
      #
      # Guards (same intent as the original #1216 design):
      #   - `push: main` (not pull_request). The actor check excludes the
      #     bot itself to avoid commit loops.
      #   - Skip if the benchmark diff reported regressions — promoting
      #     "regressed" numbers would mask real perf regressions instead
      #     of catching them. `workflow_dispatch` with
      #     `allow_performance_regressions: true` is the one-time manual
      #     override for the case where the guard itself is what's stuck
      #     (a stale committed baseline makes every push look regressed,
      #     so the auto-commit can never fire to refresh it — see the
      #     2026-07-27 incident where 5 days of drift made every push
      #     trip the diff). Same override input the hard-fail step already
      #     used on `workflow_dispatch`; this just extends it to also
      #     unblock the auto-commit.
      #   - Defer (exit 0, no error) while the merge queue is non-empty —
      #     any push to main, even `[skip ci]`, makes GitHub rebuild every
      #     queued merge group (see #1951, the same reasoning
      #     `baseline-summary-sync.yml` and promote-baseline apply). The
      #     next push:main run with an empty queue picks it up.
      #   - Re-anchor on a freshly-fetched tip of main on every retry
      #     (Option A pattern) instead of rebasing a dirty tree — under
      #     merge-queue throughput, main can advance between fetch and push.
      #   - `[skip ci]` in the commit message prevents this commit from
      #     retriggering the workflow.
      - name: Auto-commit refreshed baseline (#1216)
        if: |
          github.ref == 'refs/heads/main' &&
          github.actor != 'github-actions[bot]' &&
          (
            (github.event_name == 'push' && steps.benchmark_diff.outputs.regressions != 'true') ||
            (github.event_name == 'workflow_dispatch' && inputs.allow_performance_regressions)
          )
        env:
          MAIN_DEPLOY_KEY: ${{ secrets.MAIN_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          OWNER="${GITHUB_REPOSITORY%/*}"; NAME="${GITHUB_REPOSITORY#*/}"
          QUEUE_LEN=$(gh api graphql \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){mergeQueue{entries(first:1){totalCount}}}}' \
            -f owner="$OWNER" -f name="$NAME" \
            --jq '.data.repository.mergeQueue.entries.totalCount' 2>/dev/null || echo "")
          if [ -n "$QUEUE_LEN" ] && [ "$QUEUE_LEN" -gt 0 ] 2>/dev/null; then
            echo "Merge queue has ${QUEUE_LEN} entrie(s) — deferring benchmark baseline commit (#1951 pattern)."
            echo "It will land via the next push:main run that sees an empty queue."
            exit 0
          fi

          if [ -z "${MAIN_DEPLOY_KEY:-}" ]; then
            echo "::error::MAIN_DEPLOY_KEY secret is empty/unset (environment baseline-promote). The main-repo benchmark push needs the private half of the loopdive/js2 'MAIN_DEPLOY_KEY' deploy key (GITHUB_TOKEN is blocked by ruleset GH013)."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          eval "$(ssh-agent -s)"
          echo "$MAIN_DEPLOY_KEY" | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote remove deploykey 2>/dev/null || true
          git remote add deploykey "git@github.com:${GITHUB_REPOSITORY}.git"

          PROMOTE_SNAPSHOT="$(mktemp -d)"
          cp benchmarks/results/playground-benchmark-sidebar.json "$PROMOTE_SNAPSHOT/sidebar.json"
          [ -f benchmarks/results/playground-benchmark-sidebar-no-jit.json ] && \
            cp benchmarks/results/playground-benchmark-sidebar-no-jit.json "$PROMOTE_SNAPSHOT/sidebar-no-jit.json" || true

          PUSHED=0
          for attempt in 1 2 3 4 5; do
            git fetch deploykey main
            git checkout -f -B _benchmark_refresh_tmp deploykey/main || {
              echo "checkout of deploykey/main failed (attempt ${attempt}) — retrying"
              sleep $((attempt * 5))
              continue
            }
            cp "$PROMOTE_SNAPSHOT/sidebar.json" benchmarks/results/playground-benchmark-sidebar.json
            git add -f benchmarks/results/playground-benchmark-sidebar.json
            if [ -f "$PROMOTE_SNAPSHOT/sidebar-no-jit.json" ]; then
              cp "$PROMOTE_SNAPSHOT/sidebar-no-jit.json" benchmarks/results/playground-benchmark-sidebar-no-jit.json
              git add -f benchmarks/results/playground-benchmark-sidebar-no-jit.json
            fi
            if git diff --cached --quiet; then
              echo "Baseline already current on main after re-anchor — nothing to push."
              PUSHED=1
              break
            fi
            git commit -m "chore(ci #1216): refresh playground benchmark baseline [skip ci]"
            if git push deploykey HEAD:main; then
              echo "Pushed refreshed playground benchmark baseline to main (attempt ${attempt})."
              PUSHED=1
              break
            fi
            echo "push race lost (attempt ${attempt}) — re-anchoring on latest main and retrying"
            sleep $((attempt * 5))
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::Failed to push refreshed benchmark baseline after 5 attempts."
            exit 1
          fi

      # Note (#1216): even after auto-commit lands, the regression-detection
      # step is still informational on PR/push events (gating only on
      # workflow_dispatch). Re-enabling PR-event gating is a separate
      # follow-up that requires verifying the new CI-derived baseline is
      # stable across runner-pool changes. Until then this auto-commit
      # at least keeps the baseline from drifting indefinitely.
