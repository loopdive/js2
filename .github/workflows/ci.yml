name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Skip explicit base-ancestry check (handled by simulated merge / queue)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          # GitHub Actions checks out refs/pull/N/merge (a simulated merge of
          # the PR's HEAD into the PR's BASE) for pull_request, and the queue
          # ref for merge_group. Both inherently include the base in history.
          # The previous explicit "git merge-base --is-ancestor origin/main HEAD"
          # check had a TOCTOU race (false positives when main moved between
          # checkout and the check), and using PR base.sha tripped over the
          # shallow checkout's missing ancestry graph. Both contexts already
          # guarantee base-ancestry by construction — no extra check needed.
          echo "✓ ${{ github.event_name }} ref already includes base by construction"

      - uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: IR fallback gate (#1376)
        run: pnpm run check:ir-fallbacks

      - name: IR adoption table freshness (#2145)
        # Fails when plan/log/ir-adoption.md drifts from its generator data or
        # from the IrFallbackReason union in src/ir/select.ts. Regenerate with
        # `pnpm run gen:ir-adoption`.
        run: pnpm run check:ir-adoption

      - name: Stack-balance fixup ratchet (#1918)
        # Each stack-balance fixup repairs an emitter bug. Fails when any fixup
        # bucket grows vs. scripts/stack-balance-baseline.json — a new fixup
        # means new wrong codegen reached the safety net (some arms are lossy:
        # a missing/wrong-typed branch value patched with a const default ships
        # a silently-wrong runtime value). Shrink the producing codegen, not
        # the gate. See plan/issues/1918-stack-balance-strict-mode-fixup-ratchet.md.
        run: pnpm run check:stack-balance

      - name: Codegen silent-fallback gate (#2089)
        run: pnpm run check:codegen-fallbacks

      - name: AnyValue box-site gate (#2104)
        run: pnpm run check:any-box-sites

      - name: Coercion-site drift gate (#2108)
        # Fails when the JS-semantic coercion vocabulary (ToString/ToNumber/
        # ToPrimitive/equality/ToBoolean) is hand-rolled at a NEW site outside
        # the coercion engine (see plan/log/analysis-2026-06/03-coercion-engine
        # -spec.md §5). The single-engine migration ratchets the baseline down.
        run: pnpm run check:coercion-sites

      - name: Issue integrity + link gate (#1616)
        # Fails on duplicate IDs, filename/frontmatter ID mismatch, dangling
        # depends_on, or broken plan/issues/<id>-<slug>.md links in tracked *.md.
        run: pnpm run check:issues

      - name: Issue→probe coverage gate (#2093)
        # A bugfix issue (created on/after the cutoff) cannot flip to
        # `status: done` without a permanent probe/test reference — either a
        # tests/issue-<id>.test.ts file or a cited tests/…test… / test262/… path.
        # WARNING-only at `ready`; HARD FAIL on the done-flip. Diffs the changed
        # issue files against the PR base so only this PR's flips are gated.
        # Skips cleanly when no diff base resolves (never blocks a build it can't
        # reason about). Needs the base ref present for the diff.
        run: |
          git fetch --no-tags --depth=1 origin main 2>/dev/null || true
          ISSUE_COVERAGE_BASE=origin/main pnpm run check:issue-spec-coverage

      - name: Host-import allowlist + strict-mode gate (#1524)
        env:
          # PRs that intentionally grow the allowlist must include
          # `[allowlist-grow]` in the PR description. We forward the flag to
          # the budget test so the ratchet check accepts the growth.
          ALLOWLIST_GROW: ${{ contains(github.event.pull_request.body, '[allowlist-grow]') && '1' || '' }}
        run: |
          # `pnpm test --` doesn't forward args correctly — pnpm consumes the
          # trailing test filenames and vitest ends up running the entire suite
          # (OOMs after ~9 min). Invoke vitest directly to scope it to the 2 gate
          # files. See PR #432 investigation 2026-05-23.
          pnpm exec vitest run tests/host-import-allowlist-budget.test.ts tests/host-import-allowlist-gate.test.ts

      - name: IR alloc-provenance checker (#1586)
        # Runs the AllocSiteRegistry + provenance tests with the debug-mode
        # invariant checker enabled, so a pass that loses allocation-site
        # provenance fails CI here.
        run: pnpm run test:ir:alloc

      - name: Benchmark staleness gate (#1580)
        # Fails if the committed Wasmtime hot-runtime benchmark JSON regresses
        # to Interpreter-class string-hash numbers — the silent-staleness mode
        # that let the pre-#1580 63.7 ms warm value sit on the landing page for
        # 9 days after the fix merged (no CI regenerates that JSON; it's a
        # manual `pnpm run refresh:benchmarks:wasmtime`). Scoped to the one
        # guard test so it stays cheap; the full assertions also run in the
        # equivalence shards.
        run: pnpm exec vitest run tests/issue-1580.test.ts

      - name: Conformance numbers in sync (#1522)
        run: pnpm run sync:conformance:check

      - name: Fetch runs/index.json from baselines repo
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          # runs/index.json moved from LFS to js2wasm-baselines to avoid bandwidth exhaustion
          git clone --depth=1 https://github.com/loopdive/js2wasm-baselines.git /tmp/js2wasm-baselines 2>/dev/null || true
          if [ -f /tmp/js2wasm-baselines/runs/index.json ]; then
            mkdir -p benchmarks/results/runs
            cp /tmp/js2wasm-baselines/runs/index.json benchmarks/results/runs/index.json
          fi

      - name: Regenerate planning artifacts
        if: github.event_name == 'push'
        run: |
          if [ -d plan ] || [ -d dashboard ]; then
            pnpm run build:planning-artifacts
          else
            echo "No private planning artifacts in this checkout; skipping regeneration."
          fi

      # DISABLED (post #491): The main branch ruleset enforces the merge
      # queue, so direct `git push` from this workflow fails with
      # `GH013: Changes must be made through the merge queue`. The whole
      # auto-commit step is commented out; the typecheck/lint/format/IR
      # gates above still RUN on every push and PR — only the
      # auto-regeneration of planning artifacts back into main is disabled.
      # Planning artifacts are regenerated locally by tech-lead-driven
      # PRs (`pnpm run build:planning-artifacts`) instead.
      # - name: Commit regenerated planning artifacts
      #   if: github.event_name == 'push'
      #   run: |
      #     if [ -d plan ] || [ -d dashboard ]; then
      #       if ! git diff --quiet -- plan/goals plan/issues/sprints dashboard/data.js dashboard/data public/graph-data.json; then
      #         git config user.name "github-actions[bot]"
      #         git config user.email "github-actions[bot]@users.noreply.github.com"
      #         git add -f plan/goals plan/issues/sprints dashboard/data.js dashboard/data public/graph-data.json
      #         git commit -m "chore(planning-artifacts): regen after merge [skip ci]"
      #         git push
      #       fi
      #     fi

  # #2139 — Execute the linear-backend (linear-memory lowering), C-ABI, and
  # SIMD test suites in CI. These 20 files (tests/linear-*.test.ts,
  # tests/c-abi.test.ts, tests/simd*.test.ts) sat at tests/ root with NO CI
  # job running them: the equivalence shards only run tests/equivalence/ and
  # the `quality` job only runs lint/typecheck/gates plus a few named files.
  # That gap is why #1974/#1975/#1976/#1977 (linear-backend bugs) shipped
  # silently — nothing executed linear output after merge. All 20 files pass
  # on main, so this runs them directly (no baseline-gate needed); any failure
  # is a genuine regression and blocks the PR. Single-fork keeps peak RAM low.
  linear-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run linear-backend, C-ABI, and SIMD tests
        run: |
          # Invoke vitest directly (not `pnpm test --`) so the trailing file
          # globs are scoped to vitest and not consumed by pnpm. Single-fork +
          # no file-parallelism keeps peak RAM ~1 GB (same pattern as the
          # equivalence shards). See #2139.
          pnpm exec vitest run \
            tests/linear-*.test.ts tests/c-abi.test.ts tests/simd.test.ts tests/simd-wat.test.ts \
            --pool=forks --poolOptions.forks.singleFork=true --no-file-parallelism

  # #1659 — Run tests/equivalence/ in CI. Previously skipped because the full
  # suite OOMed under file-parallelism. Each shard runs single-fork (peak
  # ~1 GB RAM, ~1-2 min) and emits a partial failure list; the merge job
  # combines partials and gates against scripts/equivalence-baseline.json —
  # only NEW failures (not in the baseline) fail CI, so the existing failure
  # backlog does not block every PR while still catching genuine regressions.
  equivalence-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run equivalence shard ${{ matrix.shard }}/8
        env:
          SHARD: ${{ matrix.shard }}/8
          PARTIAL_OUT: equiv-partial-${{ matrix.shard }}.json
        run: node scripts/equivalence-gate.mjs
      - name: Upload partial result
        uses: actions/upload-artifact@v4
        with:
          name: equiv-partial-${{ matrix.shard }}
          path: equiv-partial-${{ matrix.shard }}.json
          retention-days: 3

  equivalence-gate:
    runs-on: ubuntu-latest
    needs: equivalence-shard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: Download shard partials
        uses: actions/download-artifact@v4
        with:
          pattern: equiv-partial-*
          path: equiv-partials
          merge-multiple: true
      - name: Gate against baseline
        env:
          MERGE_PARTIALS_DIR: equiv-partials
        run: node scripts/equivalence-gate.mjs
