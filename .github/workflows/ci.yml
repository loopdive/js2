name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify branch contains its base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          # NOTE: when GitHub Actions checks out a pull_request event it sets HEAD
          # to refs/pull/N/merge — a simulated merge of the PR's head into the
          # PR's base captured AT CHECKOUT TIME. The base sha embedded in that
          # merge is what we should compare against, not 'git fetch origin main'
          # (which races against any new push to main since checkout — leading
          # to false-positive "branch missing main commits" failures).
          # For pull_request events, github.event.pull_request.base.sha is the
          # exact base sha used to compute the simulated merge.
          # For merge_group events, the queue already merged main into the
          # group ref, so the check is trivially true.
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "✓ merge_group ref already merged base — skip explicit check"
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch origin "$BASE_SHA" --depth 1 || git fetch origin main --depth 50
          if git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            echo "✓ PR base ($BASE_SHA) is an ancestor of HEAD"
          else
            echo "::error::PR's recorded base ($BASE_SHA) is not an ancestor of HEAD. This is a checkout state anomaly — try re-running the job."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: IR fallback gate (#1376)
        run: pnpm run check:ir-fallbacks

      - name: Fetch runs/index.json from baselines repo
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          # runs/index.json moved from LFS to js2wasm-baselines to avoid bandwidth exhaustion
          git clone --depth=1 https://github.com/loopdive/js2wasm-baselines.git /tmp/js2wasm-baselines 2>/dev/null || true
          if [ -f /tmp/js2wasm-baselines/runs/index.json ]; then
            mkdir -p benchmarks/results/runs
            cp /tmp/js2wasm-baselines/runs/index.json benchmarks/results/runs/index.json
          fi

      - name: Regenerate planning artifacts
        if: github.event_name == 'push'
        run: |
          if [ -d plan ] || [ -d dashboard ]; then
            pnpm run build:planning-artifacts
          else
            echo "No private planning artifacts in this checkout; skipping regeneration."
          fi

      - name: Commit regenerated planning artifacts
        if: github.event_name == 'push'
        run: |
          if [ -d plan ] || [ -d dashboard ]; then
            if ! git diff --quiet -- plan/goals plan/issues/sprints dashboard/data.js dashboard/data public/graph-data.json; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -f plan/goals plan/issues/sprints dashboard/data.js dashboard/data public/graph-data.json
              git commit -m "chore(planning-artifacts): regen after merge [skip ci]"
              git push
            fi
          fi
