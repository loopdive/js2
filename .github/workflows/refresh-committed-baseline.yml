name: Refresh Committed Baseline

# DEPRECATED (post #491): This workflow is effectively a no-op.
#
# Background:
#   Per PR #491, the committed `benchmarks/results/test262-current.jsonl`
#   was removed from main — the dev-self-merge bucket analysis now reads
#   the baselines from the separate `loopdive/js2wasm-baselines` repo
#   instead. There is no longer a committed JSONL on main to refresh.
#
#   The main branch ruleset additionally enforces the merge queue, so any
#   `git push` from a workflow job fails with `GH013: Changes must be made
#   through the merge queue`. The push step that this workflow's `refresh`
#   job historically ended with would always fail under that ruleset.
#
# Current status:
#   - `workflow_run` and `push: main` triggers REMOVED — this workflow no
#     longer runs automatically on every test262 sharded completion or
#     push to main (it was failing every time and adding noise).
#   - `workflow_dispatch` retained so the workflow can still be invoked
#     manually if someone wants to inspect what it would have done (e.g.
#     during an audit). The terminal `git push` step inside the job will
#     still fail under the merge queue ruleset; that's expected.
#
# To fully retire: delete this file once we're confident no tooling
# references it. Tracked alongside the post-#491 CI cleanup PR.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: refresh-committed-baseline
  cancel-in-progress: false

jobs:
  refresh:
    # Three eligible event paths:
    # 1. `workflow_dispatch` — always passes (manual trigger).
    # 2. `workflow_run` after `Test262 Sharded` push to main from a real
    #    actor (the immediate, freshest path: artifact is from THIS run).
    # 3. `push` to main from a real actor — fires regardless of whether
    #    `Test262 Sharded` fired or completed. `[skip ci]` commits are
    #    filtered via head_commit.message to break loops with the bot's
    #    own commits. Routes through the workflow_dispatch logic to find
    #    the latest available artifact.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.actor.login != 'github-actions[bot]') ||
      (github.event_name == 'push' &&
       github.actor != 'github-actions[bot]' &&
       !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Resolve source CI run
        id: resolve_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            echo "Source: triggering workflow_run id=$RUN_ID"
          else
            # Manual dispatch OR push (#1235 safety-net path) — pick the most
            # recent main sharded run that uploaded an unexpired
            # `test262-merged-report` artifact. The overall run may show
            # "failure" because regression-gate flagged regressions; the
            # merged JSONL artifact is still produced and uploaded by
            # `merge-report` (which uses `if: always()`).
            RUN_ID=""
            while IFS= read -r candidate; do
              [ -z "$candidate" ] && continue
              has_artifact=$(gh api \
                "repos/${{ github.repository }}/actions/runs/$candidate/artifacts" \
                --jq '[.artifacts[] | select(.name == "test262-merged-report" and .expired == false)] | length')
              if [ "$has_artifact" = "1" ]; then
                RUN_ID="$candidate"
                break
              fi
            done < <(gh run list \
              --branch main \
              --workflow "Test262 Sharded" \
              --limit 20 \
              --json databaseId \
              -q '.[].databaseId')
            if [ -z "$RUN_ID" ]; then
              # On push events this can happen when the merge didn't trigger
              # `Test262 Sharded` (e.g. plan-only changes). That's expected;
              # exit 0 so we don't fail noisily.
              if [ "${{ github.event_name }}" = "push" ]; then
                echo "No recent main sharded run has an unexpired test262-merged-report artifact — nothing to refresh from."
                echo "skip=1" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "No recent main sharded run has an unexpired test262-merged-report artifact — abort."
              exit 1
            fi
            echo "Source: most-recent run with merged-report artifact id=$RUN_ID"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download merged report artifact
        if: steps.resolve_run.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p merged-reports
          gh run download "${{ steps.resolve_run.outputs.run_id }}" \
            -n test262-merged-report \
            -D merged-reports
          ls -la merged-reports/

      - name: Verify report sanity
        if: steps.resolve_run.outputs.skip != '1'
        id: sanity
        run: |
          set -euo pipefail
          test -f merged-reports/test262-results-merged.jsonl
          test -f merged-reports/test262-report-merged.json
          PASS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('merged-reports/test262-report-merged.json','utf8')).summary.pass)")
          TOTAL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('merged-reports/test262-report-merged.json','utf8')).summary.total)")
          echo "PASS=$PASS TOTAL=$TOTAL"
          if [ "$PASS" -lt 1000 ] || [ "$TOTAL" -lt 40000 ]; then
            echo "ABORT: report looks corrupt (pass=$PASS total=$TOTAL). Not promoting."
            exit 1
          fi
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Replace committed JSONL baseline
        if: steps.resolve_run.outputs.skip != '1'
        run: |
          set -euo pipefail
          mkdir -p benchmarks/results
          mkdir -p /tmp/js2wasm-before-refresh
          cp benchmarks/results/test262-current.jsonl /tmp/js2wasm-before-refresh/test262-current.jsonl 2>/dev/null || true
          cp merged-reports/test262-results-merged.jsonl benchmarks/results/test262-current.jsonl

      - name: Commit and push refreshed JSONL
        if: steps.resolve_run.outputs.skip != '1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f benchmarks/results/test262-current.jsonl
          if git diff --cached --quiet; then
            echo "JSONL unchanged — nothing to commit."
            exit 0
          fi
          if [ -f /tmp/js2wasm-before-refresh/test262-current.jsonl ] && \
            node scripts/compare-test262-artifact.mjs \
              --type jsonl \
              --baseline /tmp/js2wasm-before-refresh/test262-current.jsonl \
              --candidate benchmarks/results/test262-current.jsonl; then
            echo "Only volatile test262 metadata/timing changed — skipping commit."
            exit 0
          fi
          PASS=${{ steps.sanity.outputs.pass }}
          TOTAL=${{ steps.sanity.outputs.total }}
          # [skip ci] prevents this commit from retriggering CI workflows
          # (including this one). This is a pure snapshot state update —
          # no source change, so no regression check is needed.
          git commit -m "chore(test262): refresh committed JSONL baseline — ${PASS}/${TOTAL} pass [skip ci]"
          # Handle race conditions: another [skip ci] commit may have landed
          # while we were running. Try fast-forward, then fallback to
          # reset+reapply.
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            git show HEAD:benchmarks/results/test262-current.jsonl > /tmp/js2wasm-before-refresh/test262-current.after-reset.jsonl 2>/dev/null || true
            cp merged-reports/test262-results-merged.jsonl benchmarks/results/test262-current.jsonl
            git add -f benchmarks/results/test262-current.jsonl
            git diff --cached --quiet && exit 0
            if [ -f /tmp/js2wasm-before-refresh/test262-current.after-reset.jsonl ] && \
              node scripts/compare-test262-artifact.mjs \
                --type jsonl \
                --baseline /tmp/js2wasm-before-refresh/test262-current.after-reset.jsonl \
                --candidate benchmarks/results/test262-current.jsonl; then
              echo "Only volatile test262 metadata/timing changed after rebase — skipping commit."
              exit 0
            fi
            git commit -m "chore(test262): refresh committed JSONL baseline — ${PASS}/${TOTAL} pass [skip ci]"
          fi
          git push
