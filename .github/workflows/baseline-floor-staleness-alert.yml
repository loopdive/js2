name: Baseline floor staleness alert (#2178)

# #2178 — surface (alert only, #7551) a STALE standalone baseline
# FLOOR before it silently blocks the whole merge queue.
#
# The standalone regression guard (#1897) and the host regression gate diff
# every PR against a *floor* stored in `loopdive/js2wasm-baselines`
# (test262-standalone-current.json / test262-current.json, each carrying a
# `baseline_sha` = the main commit it was promoted for). The floor is supposed
# to advance once a day via test262-sharded.yml's promote-baseline on the
# daily schedule (#7551; it advanced on every push to main before that), so a
# breach is an AGE above 36 h — a daily promotion that did not land.
# When a rapid burst of main pushes (the merge-queue "thrash") drops the
# promote run for a standalone-shifting change, the floor stops advancing and
# every PR on current main fails the guard against a stale floor — the queue
# deadlocks with no obvious signal (the per-PR delta looks like a phantom
# regression identical across unrelated PRs).
#
# The per-SHA push concurrency group added to test262-sharded.yml (#2178) stops
# push:main runs from cancelling each other, which removes the root cause. This
# workflow is the BACKSTOP / observability layer required by #2178 acceptance
# criterion 3: it independently measures the floor's age and, on a breach,
# alerts loudly: a red run naming the floor's age and the last green daily run.
#
# (#7551, owner decision 2026-11-26) It NO LONGER auto-heals. The usual
# reason for a stale floor is now a daily run whose gates FAILED, and a forced
# refresh would bank exactly that regression. A forced refresh
# (refresh-baseline.yml with force_baseline_refresh + confirm_force=YES) is a
# manual dispatch only.
#
# Triggers:
#   - schedule: hourly (offset) — catches a stale floor even with no activity
#   - workflow_run: after the daily "Test262 Sharded" run completes
#   - workflow_dispatch: manual check

on:
  schedule:
    - cron: "23 * * * *" # hourly, offset from the top-of-hour Actions rush
  workflow_run:
    workflows: ["Test262 Sharded"]
    types: [completed]
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Floor staleness threshold (hours since the standalone floor was promoted) before this is a breach"
        required: false
        default: "36"
        type: string

permissions:
  contents: read
  actions: read # look up the last green daily run; nothing is dispatched (#7551)

concurrency:
  # Latest-wins: an alert sweep is idempotent, so collapse a burst of triggers
  # to the most-recent run. The prior comment said "collapses to the latest"
  # but the setting was cancel-in-progress:false (which serial-runs each) — this
  # aligns the setting with the documented intent and cuts redundant runs (#2519).
  group: baseline-floor-staleness-alert
  cancel-in-progress: true

jobs:
  check-floor:
    # On workflow_run, only act on the push:main completions of the sharded run
    # (the runs that are SUPPOSED to promote a floor). Ignore pull_request /
    # merge_group sharded runs — they never promote, so their completion says
    # nothing about floor freshness. schedule/workflow_dispatch always run.
    # (#7551) The promoting run is now the daily `schedule` run, so its
    # completion is the one that says something about floor freshness.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (deep enough to reach the floor SHA)
        uses: actions/checkout@v5
        with:
          ref: main
          # The floor can legitimately trail main by tens of commits; fetch
          # enough history that the floor SHA is reachable for the drift count.
          # check-baseline-floor-staleness.mjs reports "undetermined" (never a
          # false breach) if the SHA is still out of range.
          fetch-depth: 400

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Compute floor staleness
        id: staleness
        env:
          # (#7551) The floor is promoted by the DAILY legacy run, so it trails
          # main by up to a day of merges by design: breach on age, not count.
          MAX_FLOOR_AGE_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_age_hours || '36' }}
        run: |
          set +e
          OUT=$(node scripts/check-baseline-floor-staleness.mjs --json --ref main 2>staleness.log)
          CODE=$?
          set -e
          cat staleness.log
          echo "$OUT" > floor-staleness.json
          echo "--- floor-staleness.json ---"
          cat floor-staleness.json || true
          BREACH=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('floor-staleness.json','utf8')).breach)}catch{console.log('false')}")
          echo "breach=$BREACH" >> "$GITHUB_OUTPUT"
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Baseline floor staleness (#2178)"
            echo ""
            if [ -f floor-staleness.json ]; then
              node -e "
                const j=JSON.parse(require('fs').readFileSync('floor-staleness.json','utf8'));
                console.log('- breach: **'+j.breach+'**  (threshold '+j.maxAgeHours+' h since promotion)');
                for(const l of j.lanes||[]){
                  if(l.reachable){
                    console.log('- '+l.lane+': floor '+String(l.floorSha).slice(0,8)+' is '+l.ageHours+' h old, '+l.commitsBehindRelevant+' relevant ('+l.commitsBehindTotal+' total) commit(s) behind main'+(l.breach?' — **STALE**':''));
                  } else {
                    console.log('- '+l.lane+': staleness undetermined ('+(l.error||'floor SHA unreachable')+')');
                  }
                }
              " 2>/dev/null || cat floor-staleness.json
            else
              echo "_(no staleness output produced)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the last green daily run (#7551)
        # Alert only: NOTHING is dispatched. The auto-heal that force-promoted
        # refresh-baseline.yml here is gone (owner decision 2026-11-26) — after
        # a failed daily run it would bank the very regression that failed it.
        if: steps.staleness.outputs.breach == 'true'
        id: last_green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test262-sharded.yml/runs?event=schedule&status=success&per_page=1" \
            --jq '.workflow_runs[0] | "\(.html_url) (\(.head_sha[0:10]), \(.created_at))"' 2>/dev/null || true)
          RUN=${RUN:-none found}
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "Last green daily test262 run: $RUN"
            echo ""
            echo "Nothing was dispatched. Fix the failing daily run, or force a refresh by hand: refresh-baseline.yml with force_baseline_refresh=true and confirm_force=YES."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on breach (ntfy)
        if: steps.staleness.outputs.breach == 'true'
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          LAST_GREEN: ${{ steps.last_green.outputs.run }}
        run: |
          [ -z "${NTFY_URL:-}" ] && exit 0
          MSG=$(node -e "
            const j=JSON.parse(require('fs').readFileSync('floor-staleness.json','utf8'));
            const stale=(j.lanes||[]).filter(l=>l.breach).map(l=>l.lane+' '+l.ageHours+' h old').join(', ');
            console.log('STALE baseline floor (#2178): '+stale+' — the daily promotion did not land. Last green daily run: '+process.env.LAST_GREEN+'. Nothing dispatched.');
          " 2>/dev/null || echo "STALE baseline floor (#2178) — the daily promotion did not land. Nothing dispatched.")
          curl -s --max-time 10 \
            -H "Title: js2wasm CI" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "$MSG" \
            "$NTFY_URL" >/dev/null 2>&1 || true

      - name: Fail the run on breach (visible red signal)
        if: steps.staleness.outputs.breach == 'true'
        env:
          LAST_GREEN: ${{ steps.last_green.outputs.run }}
        run: |
          echo "::error::Baseline floor is older than the threshold (#2178, #7551): the daily promotion did not land. Last green daily run: ${LAST_GREEN}. Nothing was dispatched — fix the daily run, or force a refresh by manual dispatch of refresh-baseline.yml."
          exit 1
