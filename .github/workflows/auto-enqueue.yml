name: Auto-enqueue green PRs

# WHY: GitHub has no native "auto-enqueue when checks go green". `gh pr merge
# --auto` only arms on a check-state TRANSITION, so a PR that is already green
# by the time anyone acts is never queued; the merge queue also drops a PR when
# main advances under it. This workflow enqueues open, non-draft, mergeable PRs
# that aren't already in the queue. The merge queue re-runs the required checks
# on the merged state before landing, and the script also refuses to enqueue
# PRs with any visible failing/pending check. Drafts and PRs labelled
# hold/do-not-merge/wip are skipped.
#
# SERIAL-QUEUE INTERACTION (#1758): the merge queue is SERIAL
# (max_entries_to_build=1). An unconditional, high-frequency enqueue sweep races
# GitHub's `merge_group` formation — poking the serial head WHILE a merge group
# is mid-formation wedged the queue twice on 2026-05-30/31 (stuck
# AWAITING_CHECKS, no merge_group dispatched; only a ~10-min ruleset
# disable/re-enable reset cleared it). So the sweep is now SURGICAL. The script
# (scripts/enqueue-green-prs.mjs) applies three guards:
#   1. BACK-OFF — if ANY queue entry is AWAITING_CHECKS (a head is forming), it
#      skips the entire sweep and lets GitHub finish.
#   2. ALL-CHECKS GREEN — it rejects UNSTABLE PRs and any PR whose `gh pr
#      checks` table contains a non-pass/non-skipping row.
#   3. GRACE WINDOW — it only enqueues a PR whose checks have been green for
#      >= GRACE_MINUTES (default 10), so it never races a fresh dev enqueue and
#      only catches genuine strays.
# This workflow reinforces that with a LOWERED cron (~30 min; the
# workflow_run trigger covers the responsive case) and a single-flight
# concurrency guard so two sweeps never overlap.

on:
  # Responsive: fire right after the workflows that produce required checks finish.
  workflow_run:
    workflows: ["Test262 Sharded", "CI"]
    types: [completed]
  # Backstop: catch PRs the merge queue dropped when main advanced under them.
  # Lowered to ~30 min (#1758) — the workflow_run trigger is the responsive path;
  # the script's back-off + grace-window guards make a high cron cadence
  # unnecessary and (against a serial queue) harmful.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write # rerun cla-check when its status is stale on the head (#1958a)
  issues: write # comment + stale-draft label on aging green drafts (#1958d)

concurrency:
  group: auto-enqueue
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/enqueue-green-prs.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enqueue green PRs
        env:
          GH_TOKEN: ${{ secrets.AUTO_ENQUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/enqueue-green-prs.mjs
