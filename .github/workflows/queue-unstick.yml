name: Unstick merge queue

# WHY: GitHub's merge queue has a recurring silent-wedge failure mode (3×
# on 2026-06-10/11, 2× on 2026-05-30/31): the head entry sits AWAITING_CHECKS,
# the synthetic gh-readonly-queue branch exists, but the merge_group workflow
# runs are never created — webhooks silently don't fire. Nothing self-heals
# for ~3h (entry timeout), and the next head often wedges the same way; the
# 2026-06-10 overnight occurrence blocked all merges for 4 hours.
#
# This workflow runs scripts/unstick-merge-queue.mjs every 15 minutes. The
# script is SURGICAL (see #1758 — poking a forming queue is what wedged it in
# May): it only acts when the head has been AWAITING_CHECKS for >= 12 min with
# ZERO merge_group runs created since its enqueue, and the only mutation is a
# dequeue + re-enqueue of that head, which forces GitHub to rebuild the merge
# group and reliably re-fires the webhooks.

on:
  # Event-driven trigger (#2517): fire on every CI / Test262 completion, not only
  # the throttled */15 cron. GitHub deprioritizes scheduled workflows under load —
  # on 2026-06-19 the cron skipped for ~80 min and the queue sat wedged the whole
  # time. workflow_run mirrors auto-enqueue.yml's reliable trigger so the unstick
  # fires whenever a relevant workflow completes. The script self-gates (acts only
  # on a genuine head-AWAITING_CHECKS >=12 min with zero merge_group runs), so
  # firing it frequently is safe — it no-ops on a healthy queue.
  workflow_run:
    workflows: ["Test262 Sharded", "CI"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: queue-unstick
  cancel-in-progress: false

jobs:
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/unstick-merge-queue.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # Mint a GitHub App token (#2523). The dequeue+re-enqueue this workflow
      # performs MUST use an App token, not GITHUB_TOKEN — a bot-token re-enqueue
      # does not fire merge_group runs and would re-wedge the very head this
      # workflow exists to unstick. No GITHUB_TOKEN fallback on purpose.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ENQUEUE_APP_ID }}
          private-key: ${{ secrets.ENQUEUE_APP_PRIVATE_KEY }}
      - name: Detect and nudge a wedged queue head
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/unstick-merge-queue.mjs
