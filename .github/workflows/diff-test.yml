name: Differential test

on:
  # Removed pull_request trigger — under the merge queue model the differential
  # test runs in the merge_group context (where it tests the actual merge
  # candidate against main). PR-level runs were redundant work for every push.
  push:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  diff-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate

      - run: pnpm install --frozen-lockfile

      - name: Run differential harness
        run: npx tsx scripts/diff-test.ts
        # Harness exits non-zero on any non-match; that's expected on a
        # corpus that finds real bugs. The merge gate runs separately.
        continue-on-error: true

      - name: Upload diff-test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          retention-days: 1
          name: diff-test-report
          path: benchmarks/results/diff-test.json
          if-no-files-found: error

      # #1941 — optimize lane. Re-run the SAME corpus with `optimize: true`
      # (Binaryen wasm-opt -O3 post-pass). Catches wasm-opt miscompiles, which
      # no gate executed before. Runs after the unoptimized lane so both
      # reports exist for the differential gate below.
      - name: Run differential harness (optimize lane)
        env:
          DIFF_TEST_OPTIMIZE: "1"
        run: npx tsx scripts/diff-test.ts
        # Same as the unopt lane: non-zero on any corpus non-match is expected;
        # the merge gate compares the two lanes' deltas, not absolute pass rate.
        continue-on-error: true

      - name: Upload diff-test optimize report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          retention-days: 1
          name: diff-test-optimize-report
          path: benchmarks/results/diff-test-optimize.json
          if-no-files-found: error

      - name: Run triage (informational)
        if: always()
        run: npx tsx scripts/diff-triage.ts > diff-triage.md || true

      - name: Upload triage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          retention-days: 1
          name: diff-triage-report
          path: diff-triage.md
          if-no-files-found: warn

      # Delta-gate ON PRs ONLY — block merge if a previously-matching program
      # now mismatches. On `push: main` the baseline is refreshed below.
      - name: Delta gate (PR + merge queue)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: npx tsx scripts/diff-test-gate.ts

      # #1941 — optimize differential gate. Fails the merge candidate if
      # `--optimize` changes ANY corpus program's observable outcome vs the
      # unoptimized lane (e.g. wasm-opt produces an invalid binary, or a
      # passing program flips to a runtime error). Self-maintaining: it diffs
      # the two lanes' per-file outcomes, so there is no frozen baseline to
      # drift.
      - name: Optimize differential gate (PR + merge queue)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: npx tsx scripts/diff-test-optimize-gate.ts

      # On merge to main, refresh the committed baseline so the next PR
      # compares against the latest known-good state.
      #
      # DISABLED (post #491): The main branch ruleset enforces the merge
      # queue, so direct `git push` from a workflow job fails with
      # `GH013: Changes must be made through the merge queue`. The whole
      # commit-and-push block below is commented out; the diff-test still
      # RUNS on every push to main (its results are uploaded as artifacts
      # above), it just no longer auto-refreshes the committed baseline.
      # The baseline can be refreshed manually via a normal PR when it
      # drifts too far.
      # - name: Refresh baseline on main
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   run: |
      #     cp benchmarks/results/diff-test.json benchmarks/results/diff-test-baseline.json
      #     if ! git diff --quiet benchmarks/results/diff-test-baseline.json; then
      #       git config user.name "github-actions[bot]"
      #       git config user.email "github-actions[bot]@users.noreply.github.com"
      #       git add benchmarks/results/diff-test-baseline.json
      #       git commit -m "chore(diff-test): refresh baseline [skip ci]"
      #       git push
      #     fi
