name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run pack/publish as dry-run (no uploads)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write   # for npm provenance + JSR OIDC

jobs:
  # Guard against the drift bug (loopdive/js2#389): a `v*` tag is cut as a bare
  # lightweight tag that never bumps package.json, so publish-npm would publish
  # whatever stale version package.json happens to carry. This job fails the
  # publish unless BOTH package.json versions equal the tag version. It only
  # runs on the real publish path (tag push); the workflow_dispatch dry-run has
  # no version tag in github.ref_name, so it is skipped there.
  verify-version:
    name: verify tag matches package.json versions
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Check tag == package versions
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          root_version=$(node -p "require('./package.json').version")
          proxy_version=$(node -p "require('./packages/js2wasm/package.json').version")
          echo "tag=$tag → version=$version"
          echo "root package.json: $root_version"
          echo "proxy package.json (packages/js2wasm): $proxy_version"
          fail=0
          if [ "$root_version" != "$version" ]; then
            echo "::error::root package.json version ($root_version) does not match tag version ($version)."
            fail=1
          fi
          if [ "$proxy_version" != "$version" ]; then
            echo "::error::proxy package.json version ($proxy_version) does not match tag version ($version)."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Refusing to publish. Run 'node scripts/release.mjs <x.y.z>' to bump both package.json files in lockstep, land it as a release PR, then tag the merge commit. See docs/releasing.md."
            exit 1
          fi
          echo "Tag and package versions match ($version) — proceeding to publish."

  publish-npm:
    name: npm publish (@loopdive/js2 + js2wasm proxy)
    runs-on: ubuntu-latest
    # On a tag push, gate on verify-version (it must succeed). On
    # workflow_dispatch, verify-version is skipped (no version tag to check), so
    # allow the job to proceed: a `needs:` on a skipped job would otherwise skip
    # this one too. !failure() && !cancelled() lets a skipped dependency through
    # while still blocking on a verify-version failure.
    needs: verify-version
    if: |
      always() &&
      needs.verify-version.result != 'failure' &&
      needs.verify-version.result != 'cancelled'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack @loopdive/js2 (dry-run preview)
        run: npm pack --dry-run

      - name: Publish @loopdive/js2
        if: github.event_name == 'push' || inputs.dry-run == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish js2wasm proxy
        if: github.event_name == 'push' || inputs.dry-run == 'false'
        working-directory: packages/js2wasm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-jsr:
    name: JSR publish (@loopdive/js2)
    runs-on: ubuntu-latest
    needs: publish-npm
    if: github.event_name == 'push' || inputs.dry-run == 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Publish to JSR
        run: npx jsr publish --allow-dirty
