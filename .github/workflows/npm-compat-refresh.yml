name: Refresh npm-compat

# `benchmarks/results/npm-compat*.json` are COMMITTED artifacts that
# `website/npm-compat.html` renders directly. Before this workflow nothing
# regenerated them, so changing `scripts/generate-npm-compat-report.mjs` and
# merging it left the page serving the previous JSON — green CI, no signal
# anywhere. That shipped stale twice in one session (#3958 rendered `39/null`;
# #3977 kept showing `lit` as `not-integrated` after its suite landed), which is
# the case for a mechanism rather than for remembering. See #3988.
#
# Deliberately push-triggered. The artifact is DATA, not a correctness gate, so
# there is nothing for a PR run to decide — and a full generation is expensive
# (it re-runs the React and lit upstream suites and re-measures three perf
# lanes), which is exactly the cost that made the manual step get skipped.
#
# ── PROMOTION IS A PULL REQUEST, NOT A PUSH TO main ──────────────────────
# This workflow used to `git push deploykey HEAD:main`. It no longer does.
#
# ANY push to main — INCLUDING a `[skip ci]` one — makes GitHub rebuild every
# in-flight `merge_group` on the new base and THROW AWAY the validation running
# under it. `[skip ci]` suppresses workflows on the commit; it does not make the
# push inert to the queue. Measured 2026-08-09: PR #4323's merge group started
# 22:52 on f70b4eb2, this workflow's auto-commit landed 22:59:30, and the group
# was rebuilt at 22:59:51 — a ~19-minute `Test262 Sharded` job discarded.
# #4297 lost three windows the same day, #4300 one.
#
# `scripts/main-push-queue-gate.mjs` was supposed to prevent that, but it is a
# gate with two DELIBERATE holes: `--stale-after-hours` OVERRIDES the queue
# check once the served artifact is older than the floor (12h originally, cut
# to 1h so a deferred measurement was not lost for a whole day), and a
# malfunctioning gate fails OPEN. Both holes are correct for a direct push (a
# gate that can freeze the artifact forever is worse than an occasional rebuild
# — that is #4130), and both mean that on a busy day deferrals accumulate until
# the staleness floor forces a push into a live merge group. Cutting the floor
# to 1h made that MORE frequent, not less.
#
# Routing through a PR makes the whole class structurally impossible: main then
# only ever advances via the merge queue, which is the project's own rule. There
# is nothing left to defer, so the gate, the staleness floor and the fail-open
# branch are all gone from this path. The script itself STAYS — `benchmark-
# refresh.yml` and `refresh-baseline.yml` still push to main directly and still
# call it (see the class-coverage test in tests/issue-3915-*.test.ts).
on:
  # Driven by merges to MAIN — no cron (stakeholder, 2026-08-23). The rule:
  # if a refresh is already running, the push queues the next run; further
  # merges REPLACE the queued run while it waits (the single concurrency
  # group below keeps only the latest pending run); when the active run
  # finishes, exactly ONE queued run starts — and the `resolve` job pins
  # refs/heads/main at that moment, so it measures the latest main, not the
  # sha of whichever merge happened to survive the queue.
  push:
    branches: [main]
    # DO NOT re-trigger on our OWN landing. The measurement includes perf
    # timings, which differ on every run — so every run publishes something.
    # Without this filter each promotion landing would queue the next refresh,
    # forever: a 9-runner measurement permanently in flight with no new
    # compiler content to measure. `paths-ignore` is evaluated against the
    # union of files changed by the push, so a merge that ALSO carries real
    # work still triggers, and it is evaluated before a runner is allocated.
    paths-ignore:
      - "benchmarks/results/npm-compat.json"
      - "benchmarks/results/npm-compat-perf.json"
      - "benchmarks/results/npm-compat-history.json"
      - "website/public/benchmarks/results/npm-compat.json"
      - "website/public/benchmarks/results/npm-compat-perf.json"
      - "website/public/benchmarks/results/npm-compat-history.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  # ONE reused branch, force-updated every cycle, with at most ONE open PR on
  # it. Coalescing is the point: a queue of stale artifact PRs would be worse
  # than the problem being fixed. Nobody else ever touches this ref.
  PROMOTION_BRANCH: ci/npm-compat-refresh

# NO workflow-level concurrency group: serialization and coalescing moved to
# the JOBS (stakeholder, 2026-08-23 — "run this for each npm package
# independently"). Each measure row carries a PER-PACKAGE concurrency group,
# so every package serializes and coalesces on its own: a fast package's next
# measurement is never queued behind react-dom's ~3-4h row, and a failing
# package costs only its own entry (the coordinator carries it forward from
# the last snapshot, marked stale). Promotion is split into two lanes (fast /
# long-pole) so the dashboard updates the moment the fast rows finish. The
# resolve-at-start pin below is what keeps per-row coalescing lossless: a
# superseded queued row's trigger is contained in the main the surviving row
# measures.

jobs:
  # Pin main HEAD ONCE, at run start, for every job in this run. Runs no
  # longer measure their trigger sha: a run that sat queued behind a 4-hour
  # predecessor would otherwise measure a main that is hours stale on
  # arrival, and coalescing queued runs (see `concurrency` above) would lose
  # measurements. Resolving here makes the surviving run measure the newest
  # main and keeps all nine matrix rows plus the coordinator on ONE immutable
  # revision even while main advances mid-run.
  resolve:
    name: Resolve latest main
    if: github.repository == 'loopdive/js2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Resolve main HEAD
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ -z "$sha" ]; then echo "could not resolve refs/heads/main" >&2; exit 1; fi
          echo "resolved main HEAD: $sha (trigger was ${GITHUB_SHA})"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # One row PER PACKAGE, each with its own concurrency group: every package
  # serializes and coalesces independently, so a slow or failing package
  # never delays another package's measurement. `fail-fast: false` keeps one
  # failing package from cancelling the rest; a row that fails simply leaves
  # its package to be carried forward from the last snapshot (marked stale).
  measure-fast:
    name: Measure npm-compat (${{ matrix.package }})
    needs: resolve
    if: github.repository == 'loopdive/js2' && github.actor != 'github-actions[bot]'
    concurrency:
      group: npm-compat-pkg-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package:
          - acorn
          - marked
          - clsx
          - cookie
          - eslint
          - prettier
          - react
          - redux
          - jsdom
          - tailwindcss
          - hono
          - lodash
          - lodash-es
          - axios
          - uuid
          - moment
          - webpack
          - jest
          - styled-components
          - stylelint
          - three
          - typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure package
        env:
          NPM_COMPAT_SUITE_LOGS: 1
        run: |
          set -euo pipefail
          pnpm run generate:npm-compat -- \
            --only "${{ matrix.package }}" \
            --partial-output "$RUNNER_TEMP/npm-compat-${{ matrix.package }}.json"

      - name: Discard incomplete package report
        if: failure()
        run: rm -f "$RUNNER_TEMP/npm-compat-${{ matrix.package }}.json"

      - name: Upload package report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-compat-partial-fast-${{ matrix.package }}
          path: ${{ runner.temp }}/npm-compat-${{ matrix.package }}.json
          if-no-files-found: warn
          retention-days: 14

  # The two LONG-POLE packages (react-dom ~3-4h; lit ~40m — each runs its
  # package's own upstream suite) get their own lane so their duration and
  # their failures never gate the fast lane's promotion.
  measure-slow:
    name: Measure npm-compat (${{ matrix.package }})
    needs: resolve
    if: github.repository == 'loopdive/js2' && github.actor != 'github-actions[bot]'
    concurrency:
      group: npm-compat-pkg-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package:
          - react-dom
          - lit
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure package
        env:
          DOGFOOD_REACT_DOM_PROJECT_CONCURRENCY: 2
          NPM_COMPAT_SUITE_LOGS: 1
        run: |
          set -euo pipefail
          pnpm run generate:npm-compat -- \
            --only "${{ matrix.package }}" \
            --partial-output "$RUNNER_TEMP/npm-compat-${{ matrix.package }}.json"

      - name: Discard incomplete package report
        if: failure()
        run: rm -f "$RUNNER_TEMP/npm-compat-${{ matrix.package }}.json"

      - name: Upload package report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-compat-partial-slow-${{ matrix.package }}
          path: ${{ runner.temp }}/npm-compat-${{ matrix.package }}.json
          if-no-files-found: warn
          retention-days: 14

  # Each lane promotes the moment ITS rows finish — the fast lane's dashboard
  # update is never delayed or blocked by react-dom/lit or by any failing
  # package (row failures are carried forward from the last snapshot, marked
  # stale, inside the coordinator). Cross-lane consistency lives in the
  # coordinator's branch-overlay + freshness stamps. A lane whose rows were
  # ALL superseded in their per-package queues reports `cancelled` and its
  # promotion is skipped — a newer run owns those measurements.
  refresh-fast:
    needs: [resolve, measure-fast]
    if: always() && needs.resolve.result == 'success' && needs.measure-fast.result != 'cancelled' && github.repository == 'loopdive/js2' && github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/npm-compat-promote.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      partial_pattern: npm-compat-partial-fast-*
      lane: fast
    secrets: inherit

  refresh-slow:
    needs: [resolve, measure-slow]
    if: always() && needs.resolve.result == 'success' && needs.measure-slow.result != 'cancelled' && github.repository == 'loopdive/js2' && github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/npm-compat-promote.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      partial_pattern: npm-compat-partial-slow-*
      lane: slow
    secrets: inherit
