name: Refresh npm-compat

# `benchmarks/results/npm-compat*.json` are COMMITTED artifacts that
# `website/npm-compat.html` renders directly. Before this workflow nothing
# regenerated them, so changing `scripts/generate-npm-compat-report.mjs` and
# merging it left the page serving the previous JSON — green CI, no signal
# anywhere. That shipped stale twice in one session (#3958 rendered `39/null`;
# #3977 kept showing `lit` as `not-integrated` after its suite landed), which is
# the case for a mechanism rather than for remembering. See #3988.
#
# Deliberately push-triggered. The artifact is DATA, not a correctness gate, so
# there is nothing for a PR run to decide — and a full generation is expensive
# (it re-runs the React and lit upstream suites and re-measures three perf
# lanes), which is exactly the cost that made the manual step get skipped.
#
# ── PROMOTION IS A PULL REQUEST, NOT A PUSH TO main ──────────────────────
# This workflow used to `git push deploykey HEAD:main`. It no longer does.
#
# ANY push to main — INCLUDING a `[skip ci]` one — makes GitHub rebuild every
# in-flight `merge_group` on the new base and THROW AWAY the validation running
# under it. `[skip ci]` suppresses workflows on the commit; it does not make the
# push inert to the queue. Measured 2026-08-09: PR #4323's merge group started
# 22:52 on f70b4eb2, this workflow's auto-commit landed 22:59:30, and the group
# was rebuilt at 22:59:51 — a ~19-minute `Test262 Sharded` job discarded.
# #4297 lost three windows the same day, #4300 one.
#
# `scripts/main-push-queue-gate.mjs` was supposed to prevent that, but it is a
# gate with two DELIBERATE holes: `--stale-after-hours` OVERRIDES the queue
# check once the served artifact is older than the floor (12h originally, cut
# to 1h so a deferred measurement was not lost for a whole day), and a
# malfunctioning gate fails OPEN. Both holes are correct for a direct push (a
# gate that can freeze the artifact forever is worse than an occasional rebuild
# — that is #4130), and both mean that on a busy day deferrals accumulate until
# the staleness floor forces a push into a live merge group. Cutting the floor
# to 1h made that MORE frequent, not less.
#
# Routing through a PR makes the whole class structurally impossible: main then
# only ever advances via the merge queue, which is the project's own rule. There
# is nothing left to defer, so the gate, the staleness floor and the fail-open
# branch are all gone from this path. The script itself STAYS — `benchmark-
# refresh.yml` and `refresh-baseline.yml` still push to main directly and still
# call it (see the class-coverage test in tests/issue-3915-*.test.ts).
on:
  # Driven by merges to MAIN — no cron (stakeholder, 2026-08-23). The rule:
  # if a package's measurement is already running, the push queues the next
  # one; further merges REPLACE the queued row while it waits (each
  # per-package concurrency group keeps only the latest pending row); when
  # the active row finishes, exactly ONE queued row starts — the one from
  # the newest merge, measuring that merge's own (newest) revision.
  push:
    branches: [main]
    # DO NOT re-trigger on our OWN landing. The measurement includes perf
    # timings, which differ on every run — so every run publishes something.
    # Without this filter each promotion landing would queue the next refresh,
    # forever: a 9-runner measurement permanently in flight with no new
    # compiler content to measure. `paths-ignore` is evaluated against the
    # union of files changed by the push, so a merge that ALSO carries real
    # work still triggers, and it is evaluated before a runner is allocated.
    paths-ignore:
      - "benchmarks/results/npm-compat.json"
      - "benchmarks/results/npm-compat-perf.json"
      - "benchmarks/results/npm-compat-history.json"
      - "website/public/benchmarks/results/npm-compat.json"
      - "website/public/benchmarks/results/npm-compat-perf.json"
      - "website/public/benchmarks/results/npm-compat-history.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  # ONE reused branch, force-updated every cycle, with at most ONE open PR on
  # it. Coalescing is the point: a queue of stale artifact PRs would be worse
  # than the problem being fixed. Nobody else ever touches this ref.
  PROMOTION_BRANCH: ci/npm-compat-refresh

# NO workflow-level concurrency group: serialization and coalescing moved to
# the JOBS (stakeholder, 2026-08-23 — "run this for each npm package
# independently"). Each measure row carries a PER-PACKAGE concurrency group,
# so every package serializes and coalesces on its own: a fast package's next
# measurement is never queued behind react-dom's ~3-4h row, and a failing
# package costs only its own entry (the coordinator carries it forward from
# the last snapshot, marked stale). Promotion is split into two lanes (fast /
# long-pole) so the dashboard updates the moment the fast rows finish. The
# trigger-sha pin (see the `resolve` job) is what keeps per-row coalescing
# lossless: a superseded pending row's trigger is contained in the newer main
# whose own run's row survives the per-package queue.

jobs:
  # ONE immutable revision for every job in this run: the TRIGGER sha, via the
  # trusted `github.sha` context — deliberately NOT an API-resolved "latest
  # main". Two reasons:
  #   1. It loses nothing. Runs start immediately (serialization moved to the
  #      per-package rows), so the trigger sha IS main HEAD at run start; and
  #      any newer content-bearing merge starts its own run whose rows
  #      supersede this run's pending rows in their per-package groups. The
  #      only pushes that don't spawn a superseding run are the artifact-only
  #      ones filtered by `paths-ignore` — which change nothing measurable.
  #   2. A sha carried through a step output is TAINTED data to CodeQL
  #      (actions/cache-poisoning, 6 alerts on PR #4796): checking out an
  #      expression the analysis can't prove immutable in a default-branch
  #      workflow that then writes the shared pnpm cache reads as a
  #      cache-poisoning vector. `github.sha` is a trusted context, and it
  #      really is the stronger guarantee — nothing between GitHub and the
  #      checkout can substitute a different revision.
  resolve:
    name: Plan the measurement matrix
    if: github.repository == 'loopdive/js2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Per-lane package matrices, planned from the repo's own catalog at the
      # pinned revision (scripts/list-npm-compat-packages.mjs). Adding a
      # package to the catalog — or flagging one `"longPole": true` — scales
      # the matrix automatically; this workflow never hardcodes package names.
      fast_packages: ${{ steps.plan.outputs.fast }}
      slow_packages: ${{ steps.plan.outputs.slow }}
      promotion_pr: ${{ steps.pending.outputs.pr_number }}
    steps:
      # DON'T MEASURE WHAT CANNOT BE PUBLISHED (stakeholder, 2026-08-23).
      #
      # The coordinator already refuses to push while a promotion PR is open,
      # so a run started in that window spends ~24 runners for ~15 minutes
      # producing an artifact that is thrown away at the last step. Merges land
      # every ~20 minutes and the PR can be open for hours, so that is most
      # runs. Deciding here instead costs one 30-second job.
      #
      # The measurement is not lost, only deferred: the run after the PR merges
      # measures whatever main is by then, which is fresher than what this run
      # would have produced anyway.
      - name: Is a promotion PR already open?
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_BRANCH: ${{ env.PROMOTION_BRANCH }}
        shell: bash
        run: |
          set -uo pipefail
          # A FAILING promotion PR does not count as "open" for this gate. It
          # will never merge on its own, and both this gate and the
          # coordinator's push gate leave its branch untouched while it is
          # open — so a promotion that fails a required check DEADLOCKS the
          # dashboard: PR open -> measurement skipped -> branch never
          # regenerated -> PR never fixes itself. That is not a hypothetical;
          # #4817 sat un-mergeable on a `quality` failure while its head went
          # unchanged for hours and every refresh run skipped, and the fix that
          # would have healed it (landed on main) could not reach it.
          #
          # Skipping is only ever worth it for a promotion that can still land.
          # Nothing is protected by leaving a dead PR alone: it is not in the
          # merge queue, so force-updating it cannot eject anything, and the
          # regenerated artifact is the only thing that can make it mergeable.
          PR_JSON="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$PROMOTION_BRANCH" \
            --state open --json number,statusCheckRollup 2>/dev/null || echo "unreadable")"
          if [ "$PR_JSON" = "unreadable" ]; then
            PR_NUMBER="unreadable"
          else
            PR_NUMBER="$(printf '%s' "$PR_JSON" | jq -r '.[0].number // empty')"
            PR_FAILING="$(printf '%s' "$PR_JSON" | jq -r \
              '[.[0].statusCheckRollup[]? | select((.conclusion // "") == "FAILURE")] | length')"
          fi
          case "$PR_NUMBER" in
            "")
              echo "No open promotion PR; measuring."
              ;;
            unreadable)
              # Fail OPEN here, unlike the coordinator's push gate. The cost of
              # a wrong measurement is wasted compute; the cost of a wrong skip
              # is a stale dashboard, which is the failure this workflow exists
              # to prevent (#3988).
              echo "::warning title=npm-compat-refresh::could not list promotion PRs; measuring anyway."
              PR_NUMBER=""
              ;;
            *)
              if [ "${PR_FAILING:-0}" -gt 0 ]; then
                echo "::warning title=npm-compat-refresh::promotion PR #${PR_NUMBER} is open but has ${PR_FAILING} failing check(s); it cannot land as-is, so measuring and regenerating its branch instead of waiting for it."
                PR_NUMBER=""
              else
                echo "::notice title=npm-compat-refresh::promotion PR #${PR_NUMBER} is still open; skipping this measurement entirely. The run after it merges will measure a fresher main."
              fi
              ;;
          esac
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Plan the per-package matrices from the catalog
        id: plan
        shell: bash
        # Node-builtins-only script — no pnpm install needed here.
        run: |
          set -euo pipefail
          PLAN="$(node scripts/list-npm-compat-packages.mjs)"
          echo "matrix plan: $PLAN"
          echo "fast=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).fast))' "$PLAN")" >> "$GITHUB_OUTPUT"
          echo "slow=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).slow))' "$PLAN")" >> "$GITHUB_OUTPUT"

  # One row PER PACKAGE, each with its own concurrency group: every package
  # serializes and coalesces independently, so a slow or failing package
  # never delays another package's measurement. `fail-fast: false` keeps one
  # failing package from cancelling the rest; a row that fails simply leaves
  # its package to be carried forward from the last snapshot (marked stale).
  measure-fast:
    name: Measure npm-compat (${{ matrix.package }})
    needs: resolve
    if: needs.resolve.outputs.promotion_pr == '' && github.repository == 'loopdive/js2' && github.actor != 'github-actions[bot]'
    concurrency:
      group: npm-compat-pkg-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.resolve.outputs.fast_packages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      # `github.sha`, not a job output — a step-output sha is tainted data to
      # CodeQL and reads as cache poisoning against the default-branch pnpm
      # cache (see the `resolve` job comment).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure package
        env:
          NPM_COMPAT_SUITE_LOGS: 1
        run: |
          set -euo pipefail
          pnpm run generate:npm-compat -- \
            --only "${{ matrix.package }}" \
            --partial-output "$RUNNER_TEMP/npm-compat-${{ matrix.package }}.json"

      - name: Discard incomplete package report
        if: failure()
        run: rm -f "$RUNNER_TEMP/npm-compat-${{ matrix.package }}.json"

      - name: Upload package report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-compat-partial-fast-${{ matrix.package }}
          path: ${{ runner.temp }}/npm-compat-${{ matrix.package }}.json
          if-no-files-found: warn
          retention-days: 14

  # The two LONG-POLE packages (react-dom ~3-4h; lit ~40m — each runs its
  # package's own upstream suite) get their own lane so their duration and
  # their failures never gate the fast lane's promotion.
  measure-slow:
    name: Measure npm-compat (${{ matrix.package }})
    needs: resolve
    if: needs.resolve.outputs.promotion_pr == '' && github.repository == 'loopdive/js2' && github.actor != 'github-actions[bot]'
    concurrency:
      group: npm-compat-pkg-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.resolve.outputs.slow_packages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      # `github.sha` for the same cache-poisoning reason as measure-fast.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure package
        env:
          DOGFOOD_REACT_DOM_PROJECT_CONCURRENCY: 2
          NPM_COMPAT_SUITE_LOGS: 1
        run: |
          set -euo pipefail
          pnpm run generate:npm-compat -- \
            --only "${{ matrix.package }}" \
            --partial-output "$RUNNER_TEMP/npm-compat-${{ matrix.package }}.json"

      - name: Discard incomplete package report
        if: failure()
        run: rm -f "$RUNNER_TEMP/npm-compat-${{ matrix.package }}.json"

      - name: Upload package report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-compat-partial-slow-${{ matrix.package }}
          path: ${{ runner.temp }}/npm-compat-${{ matrix.package }}.json
          if-no-files-found: warn
          retention-days: 14

  # Each lane promotes the moment ITS rows finish — the fast lane's dashboard
  # update is never delayed or blocked by react-dom/lit or by any failing
  # package (row failures are carried forward from the last snapshot, marked
  # stale, inside the coordinator). Cross-lane consistency lives in the
  # coordinator's branch-overlay + freshness stamps. A lane whose rows were
  # ALL superseded in their per-package queues reports `cancelled` and its
  # promotion is skipped — a newer run owns those measurements.
  # Gate on `resolve` ONLY. Do NOT gate on the measure job's aggregate result:
  # a matrix job reports `cancelled` when ANY row cancels, so one superseded
  # package discarded every other package's completed measurement — the exact
  # coupling this per-package split exists to remove. Observed 2026-08-23 in
  # run 822: lit measured successfully in 29 minutes, react-dom's row was
  # cancelled 17 minutes in, and `refresh-slow` skipped, throwing lit's result
  # away. The coordinator already handles a partial lane (it carries unmeasured
  # packages forward from the last snapshot, marked stale) and now stops
  # cleanly when its lane produced no partials at all.
  refresh-fast:
    needs: [resolve, measure-fast]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.promotion_pr == '' && github.repository == 'loopdive/js2' && github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/npm-compat-promote.yml
    with:
      source_sha: ${{ github.sha }}
      partial_pattern: npm-compat-partial-fast-*
      lane: fast
    secrets: inherit

  refresh-slow:
    needs: [resolve, measure-slow]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.promotion_pr == '' && github.repository == 'loopdive/js2' && github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/npm-compat-promote.yml
    with:
      source_sha: ${{ github.sha }}
      partial_pattern: npm-compat-partial-slow-*
      lane: slow
    secrets: inherit
