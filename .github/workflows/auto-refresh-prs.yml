name: Auto-refresh open PR branches with main

# DISABLED: under the merge-queue-driven workflow, the queue builds its own
# fresh main+PR merge_group ref per cycle, so PR branches don't need force
# refreshes. Running this on every push-to-main caused massive CI churn:
# N open PRs × ~6 workflows per push = hundreds of redundant runs per merge.
#
# The queue rejects PRs that can't merge into current main due to conflicts —
# same end result as auto-refresh surfacing them preemptively, without the
# churn. Kept as workflow_dispatch-only for occasional manual housekeeping.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you manually triggering this?"
        required: false
        default: "manual refresh"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh each open PR branch via GitHub update-branch API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mapfile -t PRS < <(gh pr list --state open --limit 200 --json number --jq '.[].number')
          ok=0; fail=0
          for pr in "${PRS[@]}"; do
            out=$(gh api "repos/${{ github.repository }}/pulls/$pr/update-branch" -X PUT 2>&1)
            if echo "$out" | grep -qE 'Updating|no new commits|head branch is up'; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
              echo "fail #$pr: $out" | head -c 200
            fi
          done
          echo "ok=$ok / fail=$fail (of ${#PRS[@]})"
