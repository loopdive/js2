name: Auto-refresh open PR branches with main

# Fires on every push to main to keep open PRs current. Necessary under the
# serial merge queue + strict_required_status_checks_policy model: after each
# merge, all other auto-merge-enabled PRs become 1 commit behind main, and
# strict policy bounces them from the queue. Without auto-refresh, drain
# stalls after every merge until someone manually runs update-branch.
#
# Churn cost: every main push fires N `update-branch` calls (one per open
# PR with auto-merge enabled), each triggering CI re-runs. Acceptable cost
# for self-sustaining drain.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you manually triggering this?"
        required: false
        default: "manual refresh"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh each open PR branch via GitHub update-branch API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mapfile -t PRS < <(gh pr list --state open --limit 200 --json number --jq '.[].number')
          ok=0; fail=0
          for pr in "${PRS[@]}"; do
            out=$(gh api "repos/${{ github.repository }}/pulls/$pr/update-branch" -X PUT 2>&1)
            if echo "$out" | grep -qE 'Updating|no new commits|head branch is up'; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
              echo "fail #$pr: $out" | head -c 200
            fi
          done
          echo "ok=$ok / fail=$fail (of ${#PRS[@]})"
