<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Issue Detail — js2wasm</title>
    <link rel="icon" href="../js2logo.svg" type="image/svg+xml" />
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #060a14;
        --fg: #ffffff;
        --fg-soft: rgba(255, 255, 255, 0.78);
        --fg-faint: rgba(255, 255, 255, 0.55);
        --line-strong: rgba(255, 255, 255, 0.22);
        --line: rgba(255, 255, 255, 0.14);
        --surface: rgba(255, 255, 255, 0.04);
        --surface-hover: rgba(255, 255, 255, 0.08);
        --link: #8ab4ff;
        --link-hover: #b8cdff;
        --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg-soft);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.65;
      }
      body {
        max-width: 820px;
        margin: 0 auto;
        padding: 104px 28px 96px;
      }
      .breadcrumb {
        font-size: 13px;
        color: var(--fg-faint);
        margin-bottom: 24px;
      }
      .breadcrumb a {
        color: var(--link);
        text-decoration: none;
        transition: color 0.15s ease;
      }
      .breadcrumb a:hover {
        color: var(--link-hover);
      }
      .breadcrumb span {
        margin: 0 6px;
        color: var(--fg-faint);
      }
      a {
        color: var(--link);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition:
          color 0.15s ease,
          border-color 0.15s ease;
      }
      a:hover {
        color: var(--link-hover);
        border-bottom-color: currentColor;
      }
      h1,
      h2,
      h3,
      h4 {
        color: var(--fg);
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: 1.9rem;
        line-height: 1.25;
        margin: 0 0 28px;
      }
      h2 {
        font-size: 1.25rem;
        margin: 36px 0 12px;
        padding-top: 8px;
      }
      h3 {
        font-size: 1.05rem;
        margin: 28px 0 10px;
      }
      p,
      li {
        color: var(--fg-soft);
      }
      p {
        margin: 0 0 16px;
      }
      ul,
      ol {
        padding-left: 1.4em;
        margin: 0 0 16px;
      }
      li {
        margin: 4px 0;
      }
      strong {
        color: var(--fg);
        font-weight: 600;
      }
      em {
        color: var(--fg-soft);
      }
      code {
        font-family: var(--mono);
        font-size: 0.92em;
        background: var(--surface);
        padding: 1px 6px;
        border-radius: 4px;
        color: var(--fg);
      }
      pre {
        background: var(--surface);
        padding: 16px;
        border-radius: 4px;
        overflow-x: auto;
        margin: 0 0 16px;
      }
      pre code {
        background: none;
        padding: 0;
        border-radius: 0;
        color: var(--fg-soft);
      }
      blockquote {
        border-left: 3px solid var(--line-strong);
        margin: 16px 0;
        padding-left: 12px;
        color: var(--fg-faint);
      }
      table {
        border-collapse: collapse;
        margin: 16px 0;
        width: 100%;
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 8px 12px;
        text-align: left;
      }
      th {
        background: var(--surface);
        color: var(--fg);
      }
      .loading {
        color: var(--fg-faint);
        font-size: 14px;
      }
      .error {
        color: #f87171;
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.3);
        padding: 16px;
        border-radius: 4px;
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <div class="breadcrumb">
      <a href="./">Dashboard</a>
      <span>/</span>
      <span id="issue-num">Issue</span>
    </div>
    <article id="content">
      <div class="loading">Loading issue...</div>
    </article>

    <script>
      // The site is served from the domain root (js2wasm.loopdive.com) AND from a
      // project subpath (loopdive.github.io/js2/). Absolute "/plan/issues/…"
      // fetches only work in the first case — under the subpath they resolve to
      // loopdive.github.io/plan/… and 404, so this viewer was unreachable there.
      // Derive the base the same way benchmarks/report.html does.
      const BASE_PATH = window.location.pathname.replace(/\/dashboard\/.*$/, "");
      function issueAsset(path) {
        return BASE_PATH ? `${BASE_PATH}/${path}` : `/${path}`;
      }

      // Fetch an issue's markdown. `slug` may be a full filename stem
      // (681-pure-wasm-…) or a bare issue id (681 / 1525b). Resolution works in
      // both modes:
      //   dev  — the dashboard Vite plugin serves /plan/issues/*.md from the
      //          repo root and prefix-resolves bare ids to <id>-*.md
      //   prod — scripts/build-pages.js copies plan/issues into the site and
      //          writes index.json (id → filename) for the bare-id fallback
      async function fetchIssueMarkdown(slug) {
        // 1) Try the slug directly (full filename, or a bare id the dev plugin
        //    prefix-resolves).
        let response = await fetch(issueAsset(`plan/issues/${slug}.md`));
        if (response.ok) return await response.text();

        // 2) Fall back: treat the slug as a bare id and resolve via index.json.
        const index = await fetch(issueAsset("plan/issues/index.json"))
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);
        if (index && index[slug]) {
          response = await fetch(issueAsset(`plan/issues/${index[slug]}.md`));
          if (response.ok) return await response.text();
        }

        throw new Error(`Issue not found: ${slug}`);
      }

      async function loadIssue() {
        // Extract the issue reference from the URL. `slug` is the dashboard's
        // form (full filename stem); `id` is the numeric form used by callers
        // that only carry an issue id — the report page's root-cause buckets
        // and the npm-compat cards. Both funnel into the same resolver, which
        // already handles a bare id via index.json.
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug") || params.get("id");

        if (!slug) {
          document.getElementById("content").innerHTML =
            '<div class="error">Invalid issue URL. Missing slug or id parameter.</div>';
          return;
        }

        document.getElementById("issue-num").textContent = `#${slug.split("-")[0]}`;

        try {
          const markdown = await fetchIssueMarkdown(slug);

          // Remove frontmatter
          const contentStart = markdown.indexOf("---", 3) + 3;
          const content = markdown.substring(contentStart).trim();

          // Render markdown to HTML
          const html = marked.parse(content);

          // Display the rendered content
          document.getElementById("content").innerHTML = html;
        } catch (error) {
          document.getElementById("content").innerHTML =
            `<div class="error"><strong>Error loading issue:</strong> ${escapeHtml(error.message)}</div>`;
          console.error("Failed to load issue:", error);
        }
      }

      function escapeHtml(text) {
        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        };
        return text.replace(/[&<>"']/g, (c) => map[c]);
      }

      // Load issue when DOM is ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadIssue);
      } else {
        loadIssue();
      }
    </script>
  </body>
</html>
