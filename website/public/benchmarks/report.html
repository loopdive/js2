          view = { mode: "host", fileResultsSrc: RESULTS_JSONL },
          allowedCategories = null,
          allowedEditions = null,
          isCurrent = () => true,
        } = opts;
        container.textContent = "";
        if (view.mode === "standalone") {
          renderStandaloneRootCauses(container, opts);
          return;
        }
        return renderHostErrorPatterns(container, view.fileResultsSrc, allowedCategories, allowedEditions, isCurrent);
      }

      // Buckets in the standalone root_cause_map that are, by construction,
      // host-dependency gaps: they fail in pure-Wasm standalone mode but pass
      // when a JS host supplies the missing capability. Used by the #5
      // "differential" filter to show only standalone-specific failures.
      const HOST_DEPENDENT_BUCKET_IDS = new Set([
        "leaked-host-import",
        "late-import-index-shift",
        "binary-emit-u32-out-of-range",
        "standalone-json-codec",
        "standalone-regexp",
        "standalone-regexp-phase-2d",
        "standalone-regexp-phase-2b",
        "standalone-regexp-string-protocol",
        "standalone-regexp-native-engine",
        "standalone-dynamic-object-property",
        "standalone-reflect-refusal",
        "standalone-iterator-protocol",
        "standalone-getter-callback-bridge",
        "issamevalue-invalid-wasm",
        "object-to-primitive",
        "extern-class-metadata",
      ]);

      function renderStandaloneRootCauses(container, opts) {
        const {
          view,
          allowedCategories = null,
          allowedEditions = null,
          differentialOnly = false,
          setDifferential,
        } = opts;
        const rcMap = view.report.root_cause_map;
        if (!rcMap || !Array.isArray(rcMap.buckets)) {
          container.appendChild(el("div", { className: "no-data" }, "No standalone root-cause data available."));
          return;
        }

        container.appendChild(el("h2", null, "Standalone Failure Root Causes"));

        // Differential toggle (#5).
        const toggleWrap = el("div", { className: "filter-toggles", style: { marginBottom: "0.5rem" } });
        const diffToggle = el("label", { className: "filter-toggle" + (differentialOnly ? " active" : "") });
        const diffCheckbox = el("input", { type: "checkbox" });
        diffCheckbox.checked = differentialOnly;
        if (differentialOnly) diffCheckbox.setAttribute("checked", "checked");
        diffCheckbox.addEventListener("change", () => setDifferential && setDifferential(diffCheckbox.checked));
        diffToggle.appendChild(diffCheckbox);
        diffToggle.appendChild(el("span", null, "Standalone-only (not in JS host)"));
        toggleWrap.appendChild(diffToggle);
        container.appendChild(toggleWrap);
        container.appendChild(
          el(
            "div",
            { className: "diff-note" },
            differentialOnly
              ? "Showing host-dependency gaps: failures that occur in pure-Wasm standalone mode but pass with a JS host."
              : "Failures grouped by root cause. Toggle above to isolate standalone-only (host-dependency) gaps.",
          ),
        );

        // Edition filter. The standalone view ships no per-file JSONL, so the
        // page cannot classify these failures itself — instead each bucket
        // carries a `by_edition` breakdown baked in by build-test262-report.mjs
        // (#2871 follow-up). When it's present, the bucket count is re-scoped
        // to the selected edition range and empty buckets drop out. Older
        // reports without it fall back to the coarse sample-file/category
        // heuristic, which only ever hides whole buckets.
        const editionBreakdown = rcMap.has_edition_breakdown === true;
        let buckets = rcMap.buckets.slice();
        if (differentialOnly) {
          buckets = buckets.filter((b) => HOST_DEPENDENT_BUCKET_IDS.has(b.id));
        }
        const scopedCount = (b) => {
          if (!allowedEditions || !editionBreakdown) return b.count || 0;
          let n = 0;
          for (const [edition, count] of Object.entries(b.by_edition || {})) {
            if (allowedEditions.has(edition)) n += count;
          }
          return n;
        };
        if (allowedEditions && editionBreakdown) {
          buckets = buckets.filter((b) => scopedCount(b) > 0);
        } else if (allowedCategories) {
          buckets = buckets.filter((b) => bucketTouchesCategories(b, allowedCategories));
        }
        buckets.sort((a, b) => scopedCount(b) - scopedCount(a));

        const totalShown = buckets.reduce((a, b) => a + scopedCount(b), 0);
        container.appendChild(
          el(
            "div",
            {
              className: "subtitle",
              style: { color: "var(--text-muted)", fontSize: "0.75rem", marginBottom: "0.75rem" },
            },
            buckets.length +
              " root-cause buckets · " +
              totalShown.toLocaleString() +
              " failures" +
              (allowedEditions
                ? editionBreakdown
                  ? " · filtered to the selected edition range"
                  : " · edition filter unavailable for this report (showing all editions)"
                : ""),
          ),
        );

        if (buckets.length === 0) {
          container.appendChild(el("div", { className: "no-data" }, "No matching failures for the current filters."));
          return;
        }

        const list = el("div", { style: { display: "flex", flexDirection: "column", gap: "0.5rem" } });
        for (const b of buckets) {
          const card = el("div", { className: "card", style: { cursor: "pointer" } });
          const header = el("div", {
            style: { display: "flex", alignItems: "baseline", gap: "0.75rem", flexWrap: "wrap" },
          });
          header.appendChild(
            el(
              "span",
              {
                style: {
                  background: "var(--error)",
                  color: "var(--bg)",
                  fontWeight: "700",
                  fontSize: "0.75rem",
                  padding: "2px 8px",
                  borderRadius: "10px",
                  flexShrink: "0",
                },
              },
              scopedCount(b).toLocaleString(),
            ),
          );
          header.appendChild(
            el("span", { style: { fontSize: "0.8125rem", wordBreak: "break-word" } }, b.label || b.id),
          );
          // These ids are THIS project's markdown issues (plan/issues/<id>-<slug>.md),
          // not GitHub issues. The repo has no GitHub issues at all, and issue
          // ids share one number sequence with PRs — so linking to
          // github.com/loopdive/js2wasm/issues/<id> did not 404, it silently
          // redirected to an unrelated PULL REQUEST (e.g. the Temporal bucket's
          // #661 opened "docs(#1632): escalate Function.bind/toString"). Point
          // at the dashboard's markdown viewer instead, which resolves a bare
          // id — including suffixed ones like 1326c — via plan/issues/index.json.
          for (const issue of b.issues || []) {
            const num = String(issue).replace(/^#/, "");
            header.appendChild(
              el(
                "a",
                {
                  className: "rc-issue-link",
                  href: assetPath("dashboard/issue.html?id=" + encodeURIComponent(num)),
                  target: "_blank",
                  rel: "noopener",
                },
                "#" + num,
              ),
            );
          }
          card.appendChild(header);

          const detail = el("div", {
            style: { display: "none", marginTop: "0.5rem", borderTop: "1px solid var(--border)", paddingTop: "0.5rem" },
          });
          for (const f of b.sample_files || []) {
            detail.appendChild(
              el(
                "div",
                { className: "detail-fname", style: { fontSize: "0.6875rem", padding: "2px 0" } },
                (f || "").replace("test/", ""),
              ),
            );
          }
          for (const sig of b.sample_signatures || []) {
            if (!sig) continue;
            detail.appendChild(el("div", { className: "detail-err", style: { paddingLeft: "0" } }, sig));
          }
          if ((b.sample_files || []).length === 0 && (b.sample_signatures || []).length === 0) {
            detail.appendChild(
              el("div", { style: { color: "var(--text-muted)", fontSize: "0.625rem" } }, "No samples recorded."),
            );
          }
          card.appendChild(detail);
          card.addEventListener("click", () => {
            detail.style.display = detail.style.display === "none" ? "block" : "none";
          });
          list.appendChild(card);
        }
        container.appendChild(list);
      }

      // Derive whether a root-cause bucket touches any allowed category, from
      // its sample file paths (e.g. "test/built-ins/RegExp/..." → category
      // prefix "built-ins/RegExp"). Coarse but consistent with the category
      // table's edition filter. Buckets with no usable samples are kept (we
      // can't prove they're outside the range).
      function bucketTouchesCategories(bucket, allowedCategories) {
        const samples = bucket.sample_files || [];
        if (samples.length === 0) return true;
        for (const f of samples) {
          const rel = String(f).replace(/^test\//, "");
          for (const cat of allowedCategories) {
            if (rel.startsWith(cat + "/") || rel.startsWith(cat)) return true;
          }
        }
        return false;
      }

      async function renderHostErrorPatterns(
        container,
        fileResultsSrc,
        allowedCategories,
        allowedEditions = null,
        isCurrent = () => true,
      ) {
        const loadingEl = el(
          "div",
          { style: { color: "var(--text-muted)", padding: "1rem" } },
          "Loading error patterns...",
        );
        container.appendChild(loadingEl);
        try {
          // (#2871 follow-up) The per-file edition index is what makes the slider useful
          // here. Filtering by category is a near no-op — almost every category
          // holds at least one ES5 test, so "ES5" showed the whole list.
          const [map, fileEditions] = await Promise.all([
            loadFileResults(fileResultsSrc),
            allowedEditions ? loadFileEditions() : Promise.resolve(null),
          ]);
          // A newer render (slider moved) owns the container now — bail rather
          // than appending a duplicate section.
          if (!isCurrent()) return;
          loadingEl.remove();
          if (!map) {
            container.appendChild(el("div", { className: "no-data" }, "No file-level data for error patterns"));
            return;
          }

          // Group errors by normalized message
          const patterns = new Map(); // message -> { count, files: [{file, error, status}] }
          for (const [cat, files] of map) {
            // (#2871 #4) Honor the edition slider. Prefer the precise per-file
            // edition index; fall back to the coarse per-category filter only
            // when that artifact isn't deployed yet.
            if (allowedCategories && !fileEditions && !allowedCategories.has(cat)) continue;
            for (const f of files) {
              if (f.status !== "compile_error" && f.status !== "fail") continue;
              if (allowedEditions && fileEditions) {
                const ed = fileEditionOf(fileEditions, f.file);
                if (ed) {
                  // Classified: drop it when it sits outside the selection.
                  if (!allowedEditions.has(ed)) continue;
                } else if (isProposalScopeRecord(f)) {
                  // Not in the index — which lags the JSONL whenever test262
                  // gains files — but the record's own scope says proposal, and
                  // no proposal is part of any published edition. Without this
                  // the leftovers surfaced in every edition (see the helper).
                  continue;
                }
                // Still unclassified and standard-scope ⇒ can't prove it's out
                // of range, so keep it rather than blanking a real failure.
              }
              const err = f.error || "";
              if (!err) continue;
              // Normalize: strip line numbers, file-specific details
              let key = err
                .replace(/L\d+:\d+/g, "L*:*")
                .replace(/#\d+/g, "#*")
                .replace(/"[^"]{20,}"/g, '"..."')
                .replace(/\d{3,}/g, "*");
              // Truncate to first error (before semicolon) for grouping
              const semi = key.indexOf(";");
              if (semi > 0) key = key.substring(0, semi).trim();
              if (key.length > 120) key = key.substring(0, 120) + "...";

              if (!patterns.has(key)) patterns.set(key, { count: 0, status: f.status, files: [] });
              const p = patterns.get(key);
              p.count++;
              if (p.files.length < 50) p.files.push({ file: f.file, error: err });
            }
          }

          // Sort by count descending
          const sorted = [...patterns.entries()].sort((a, b) => b[1].count - a[1].count);

          container.appendChild(el("h2", null, "Error Patterns"));
          if (sorted.length === 0) {
            container.appendChild(
              el("div", { className: "no-data" }, "No fail/compile-error patterns in the selected edition range."),
            );
            return;
          }
          container.appendChild(
            el(
              "div",
              { className: "subtitle" },
              sorted.length +
                " distinct patterns across " +
                sorted.reduce((a, [, v]) => a + v.count, 0) +
                " errors" +
                (allowedEditions && fileEditions ? " · filtered to the selected edition range" : ""),
            ),
          );

          const patternList = el("div", {
            style: { display: "flex", flexDirection: "column", gap: "0.5rem" },
          });

          // Show top 50 patterns
          for (const [pattern, data] of sorted.slice(0, 50)) {
            const card = el("div", {
              className: "card",
              style: { cursor: "pointer" },
            });
            const headerRow = el("div", {
              style: {
                display: "flex",
                alignItems: "baseline",
                gap: "0.75rem",
              },
            });

            const countBadge = el(
              "span",
              {
                style: {
                  background: data.status === "compile_error" ? "var(--error)" : "var(--fail)",
                  color: "var(--bg)",
                  fontWeight: "700",
                  fontSize: "0.75rem",
                  padding: "2px 8px",
                  borderRadius: "10px",
                  flexShrink: "0",
                },
              },
              String(data.count),
            );
            headerRow.appendChild(countBadge);

            const statusLabel = el(
              "span",
              {
                style: {
                  color: "var(--text-muted)",
                  fontSize: "0.625rem",
                  flexShrink: "0",
                },
              },
              data.status === "compile_error" ? "CE" : "FAIL",
            );
            headerRow.appendChild(statusLabel);

            const msgEl = el(
              "span",
              {
                style: {
                  fontFamily: "'SF Mono', SFMono-Regular, Consolas, monospace",
                  fontSize: "0.6875rem",
                  wordBreak: "break-word",
                },
              },
              pattern,
            );
            headerRow.appendChild(msgEl);

            card.appendChild(headerRow);

            // Expandable file list (hidden by default)
            const fileList = el("div", {
              style: {
                display: "none",
                marginTop: "0.5rem",
                borderTop: "1px solid var(--border)",
                paddingTop: "0.5rem",
              },
            });

            for (const f of data.files) {
              const fileEntry = el("div", { className: "detail-file" });
              const fname = (f.file || "").replace("test/", "");

              const fhdr = el("div", { className: "detail-file-header" });
              const lineMatch = f.error.match(/L(\d+):(\d+)\s/);
              const lineInfo = lineMatch ? ":" + lineMatch[1] : "";
              fhdr.appendChild(el("span", { className: "detail-fname" }, fname + lineInfo));
              fileEntry.appendChild(fhdr);

              // Source context placeholder
              fileEntry.appendChild(fetchSourceLines(f.file, f.error));
              fileList.appendChild(fileEntry);
            }
            if (data.count > data.files.length) {
              fileList.appendChild(
                el(
                  "div",
                  {
                    style: {
                      color: "var(--text-muted)",
                      fontSize: "0.625rem",
                      padding: "4px 0",
                    },
                  },
                  "... and " + (data.count - data.files.length) + " more files",
                ),
              );
            }

            card.appendChild(fileList);

            // Toggle expand on click
            card.addEventListener("click", () => {
              const isOpen = fileList.style.display !== "none";
              fileList.style.display = isOpen ? "none" : "block";
            });

            patternList.appendChild(card);
          }

          if (sorted.length > 50) {
            patternList.appendChild(
              el(
                "div",
                {
                  style: {
                    color: "var(--text-muted)",
                    textAlign: "center",
                    padding: "0.5rem",
                  },
                },
                "... " + (sorted.length - 50) + " more patterns",
              ),
            );
          }

          container.appendChild(patternList);
        } catch (e) {
          loadingEl.textContent = "Error loading patterns: " + e.message;
        }
      }

      // Rewrite every summary-shaped node in a standalone report so `pass`
      // counts only host-free passes (leaky passes → fail). Mutates in place;
      // the standalone report object is not shared with the host report.
      function applyStandaloneHostFree(node) {
        if (Array.isArray(node)) {
          node.forEach(applyStandaloneHostFree);
          return;
        }
        if (!node || typeof node !== "object") return;
        if (typeof node.host_free_pass === "number" && typeof node.total === "number") {
          const hf = node.host_free_pass;
          const ce = Number(node.ce) || Number(node.compile_error || 0) + Number(node.compile_timeout || 0);
          const skip = Number(node.skip) || 0;
          node.pass = hf;
          node.fail = Math.max(0, node.total - hf - ce - skip);
        }
        for (const key of Object.keys(node)) applyStandaloneHostFree(node[key]);
      }

      async function main() {
        // The overall pass-rate history is fetched by the shared
        // <t262-conformance-trend> component itself. The per-lane per-edition
        // history (runs/editions-index.json + its standalone twin, #4362) is no
        // longer fetched here: it only fed the edition-card sparklines, which
        // the donut-first card layout dropped.
        const [conformance, standaloneReport, categoryEditions] = await Promise.all([
          loadReportWithFallback(),
          loadJSON(STANDALONE_REPORT_JSON),
          loadJSON(CATEGORY_EDITIONS_JSON),
        ]);
        const app = document.getElementById("app");
        app.textContent = "";

        // Standalone honesty (host-free): a "leaky pass" passed only because the
        // compiled Wasm still reached for a JS-host import, so it is NOT a true
        // standalone pass. Count host_free_pass as pass across every
        // summary-shaped node (overall / official / strict / full / per-scope /
        // by_category), pushing leaky passes into fail. Keeps the standalone
        // headline consistent with the honest host-free number (matches the
        // per-edition slider, which is already generated with --host-free).
        applyStandaloneHostFree(standaloneReport);

        if (conformance) {
          // (#2871 #1) Host (JS) vs Standalone (pure Wasm) views. Both share the
          // same report schema; standalone ships no per-file JSONL, so the
          // per-test error-pattern list degrades to the root-cause buckets.
          //
          // The per-category×edition map is SHARED, not host-only. An edition is
          // a property of the test file's frontmatter, not of the compile
          // target, and the category-table filter reads only this map's edition
          // KEYS (`computeAllowedCategories`), never its host pass/fail counts —
          // so pointing the standalone view at it cannot leak host numbers.
          // Passing `null` here used to make `computeAllowedCategories` bail out
          // and return null, which `applyFilters` reads as "no edition filter":
          // every standalone category row stayed visible at every slider
          // position, so selecting ES2026 still listed `built-ins/Temporal`
          // (4,603 proposal tests). The only standalone categories absent from
          // the map are `built-ins/Temporal` and `built-ins/AbstractModuleSource`
          // (both Proposals) plus `built-ins/undefined` and `language/export`
          // (both Unclassified) — none is a published edition, so hiding them
          // under a published-edition selection is correct and makes the two
          // views behave the same way.
          const hostView = {
            mode: "host",
            report: conformance,
            editionsSrc: HOST_EDITIONS_JSON,
            categoryEditions: categoryEditions || null,
            fileResultsSrc: RESULTS_JSONL,
          };
          const standaloneView = standaloneReport
            ? {
                mode: "standalone",
                report: standaloneReport,
                editionsSrc: STANDALONE_EDITIONS_JSON,
                categoryEditions: categoryEditions || null,
                fileResultsSrc: null,
              }
            : null;

          // Mode switch (only shown when standalone data is available).
          // ?mode= wins over the remembered choice: an explicit link should
          // show what it says regardless of what this browser last looked at.
          // Standalone (pure Wasm, no JS host imports) is the DEFAULT lane on
          // both surfaces — the honest floor of what the compiler produces on
          // its own. Host mode is the opt-in, via the switch, `?mode=host`, or
          // a remembered choice. It still falls back to host when no standalone
          // report was published.
          const conformanceHost = el("div");
          const preferredMode = initialViewState.mode || localStorage.getItem("t262-mode") || "standalone";
          let activeMode = standaloneView && preferredMode !== "host" ? "standalone" : "host";
          const renderActive = () => {
            const filterInputs = {
              strict: conformanceHost.querySelector('[data-report-toggle="strict"] input'),
              legacy: conformanceHost.querySelector('[data-report-toggle="legacy"] input'),
            };
            const preservedState = {
              donut: conformanceHost.querySelector("t262-donut"),
              editionTimeline: conformanceHost.querySelector("t262-edition-timeline"),
              historyTrendChart: conformanceHost.querySelector("t262-conformance-trend.summary-history-chart"),
              strictOnly: filterInputs.strict?.checked,
              includeLegacy: filterInputs.legacy?.checked,
            };
            conformanceHost.textContent = "";
            const view = activeMode === "standalone" && standaloneView ? standaloneView : hostView;
            renderConformance(view, conformanceHost, preservedState);
          };
          if (standaloneView) {
            const modeSwitch = el("div", { className: "mode-switch" });
            const mkBtn = (mode, main, sub) => {
              const b = el(
                "button",
                { className: mode === activeMode ? "active" : "" },
                main,
                el("span", { className: "mode-sub" }, sub),
              );
              b.addEventListener("click", () => {
                if (activeMode === mode) return;
                activeMode = mode;
                localStorage.setItem("t262-mode", mode);
                window.t262ViewState?.write({ mode });
                modeSwitch.querySelectorAll("button").forEach((x) => x.classList.remove("active"));
                b.classList.add("active");
                renderActive();
              });
              return b;
            };
            modeSwitch.appendChild(mkBtn("host", "Host mode", "JS runtime imports"));
            modeSwitch.appendChild(mkBtn("standalone", "Standalone", "pure Wasm, no JS host"));
            app.appendChild(modeSwitch);
          }
          app.appendChild(conformanceHost);
          renderActive();
        } else {
          app.appendChild(
            el("div", { className: "no-data" }, "No test262 report found. Run: npx vitest run tests/test262.test.ts"),
          );
        }

        // Timestamp is now rendered inside renderConformance
      }

      main();
    </script>
  </body>
</html>
